<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Build Plan form banner · 1600×400</title>
<link rel="stylesheet" href="fonts-inline.css">
<style>
:root{
  --notebook:#FFFCF7; --static:#1E1E1E; --ballpoint:#0061FF;
  --recording:#FF4F14; --recording-600:#E23E07; --cellotape:#F2E5B9;
  --grid:rgba(30,30,30,.07);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#555}
.banner{
  width:1600px;height:400px;position:relative;overflow:hidden;
  background:var(--notebook);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:32px 32px;
  font-family:'Degular Display',sans-serif;color:var(--static);
  margin:0 auto 40px;
}
.kick{position:absolute;left:64px;top:44px;display:flex;align-items:center;gap:15px;font-family:'Space Mono',monospace;font-weight:700;font-size:17px;letter-spacing:.16em;text-transform:uppercase;z-index:5}
.kick .sq{width:14px;height:14px;background:var(--ballpoint)}
.kick .live{background:var(--recording);color:var(--notebook);padding:4px 11px;border-radius:3px;font-size:14px;letter-spacing:.14em;transform:rotate(-1.2deg);border:2px solid var(--static);box-shadow:3px 3px 0 var(--static)}
.map{position:absolute;inset:0;z-index:2}
.tape{position:absolute;width:110px;height:28px;background:var(--cellotape);opacity:.92;border:1px solid rgba(30,30,30,.16);z-index:6}
.tape.t1{top:-10px;left:700px;transform:rotate(-3deg)}
.tape.t2{bottom:30px;right:-26px;transform:rotate(50deg)}
.strip{position:absolute;left:0;right:0;bottom:0;height:16px;background:var(--static);display:flex;z-index:7}
.strip i{flex:1;background:var(--ballpoint)}
.strip i.o{background:var(--recording)}
.strip i.k{background:var(--static)}
.strip i.c{background:var(--cellotape)}
.seal{position:absolute;right:54px;top:38px;height:54px;z-index:5;transform:rotate(7deg)}
</style>
</head>
<body>
<div class="banner" id="b1">
  <div class="kick"><span class="sq"></span>The Build Plan<span class="live">Live buyers only</span></div>
  <img class="seal" src="cs-seal.png" alt="Creator Science">

  <svg class="map" viewBox="0 0 1600 400" fill="none">
    <!-- the dashed ballpoint route -->
    <path d="M150 318
             C 230 318, 270 256, 360 248
             C 450 240, 470 296, 560 290
             C 680 282, 700 196, 810 196
             C 920 196, 940 268, 1050 262
             C 1160 256, 1190 168, 1295 162"
          stroke="#0061FF" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 26" opacity=".9"/>

    <!-- START: hand-drawn map pin -->
    <g transform="translate(150 318)">
      <path d="M0 -8 C -26 -8, -34 -34, -34 -46 C -34 -68, -18 -82, 0 -82 C 18 -82, 34 -68, 34 -46 C 34 -34, 26 -8, 0 -8 Z"
            fill="#FF4F14" stroke="#1E1E1E" stroke-width="5" transform="rotate(2)"/>
      <circle cx="0" cy="-48" r="11" fill="#FFFCF7" stroke="#1E1E1E" stroke-width="4.5"/>
      <ellipse cx="0" cy="4" rx="26" ry="7" fill="none" stroke="#1E1E1E" stroke-width="4" opacity=".45"/>
      <text x="-2" y="48" text-anchor="middle" font-family="'Space Mono',monospace" font-weight="700" font-size="17" letter-spacing="2.4" fill="#1E1E1E">YOU ARE HERE</text>
    </g>

    <!-- NODE 30: lightbulb (the concept) -->
    <g transform="translate(360 240) rotate(-2)">
      <circle cx="0" cy="-12" r="46" fill="#FFFCF7" stroke="#1E1E1E" stroke-width="5"/>
      <circle cx="0" cy="-12" r="46" fill="none" stroke="#1E1E1E" stroke-width="2.5" transform="rotate(7) translate(2 2)" opacity=".5"/>
      <text x="0" y="8" text-anchor="middle" font-family="'Degular Display',sans-serif" font-weight="900" font-size="56" fill="#1E1E1E">30</text>
      <!-- bulb doodle -->
      <g transform="translate(40 -64) rotate(14)">
        <circle cx="0" cy="0" r="13" fill="#F2E5B9" stroke="#1E1E1E" stroke-width="4"/>
        <path d="M-5 13 h10 M-4 19 h8" stroke="#1E1E1E" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M-20 -12 l-8 -5 M20 -12 l8 -5 M0 -18 v-9" stroke="#E23E07" stroke-width="4" stroke-linecap="round"/>
      </g>
    </g>

    <!-- NODE 60: bricks (the room gets built) -->
    <g transform="translate(810 188) rotate(1.5)">
      <circle cx="0" cy="0" r="46" fill="#FFFCF7" stroke="#1E1E1E" stroke-width="5"/>
      <circle cx="0" cy="0" r="46" fill="none" stroke="#1E1E1E" stroke-width="2.5" transform="rotate(-9) translate(-2 2)" opacity=".5"/>
      <text x="0" y="20" text-anchor="middle" font-family="'Degular Display',sans-serif" font-weight="900" font-size="56" fill="#1E1E1E">60</text>
      <!-- brick wall doodle -->
      <g transform="translate(44 -58) rotate(-6)">
        <rect x="0" y="0" width="26" height="13" fill="#0061FF" stroke="#1E1E1E" stroke-width="3.5"/>
        <rect x="28" y="0" width="26" height="13" fill="#FFFCF7" stroke="#1E1E1E" stroke-width="3.5"/>
        <rect x="14" y="15" width="26" height="13" fill="#FFFCF7" stroke="#1E1E1E" stroke-width="3.5"/>
        <rect x="42" y="15" width="26" height="13" fill="#F2E5B9" stroke="#1E1E1E" stroke-width="3.5"/>
      </g>
    </g>

    <!-- NODE 90: doors open -->
    <g transform="translate(1295 162)">
      <circle cx="0" cy="0" r="54" fill="#FF4F14" stroke="#1E1E1E" stroke-width="5.5"/>
      <circle cx="0" cy="0" r="54" fill="none" stroke="#1E1E1E" stroke-width="2.5" transform="rotate(11) translate(3 -2)" opacity=".6"/>
      <text x="0" y="21" text-anchor="middle" font-family="'Degular Display',sans-serif" font-weight="900" font-size="62" fill="#FFFCF7">90</text>
      <!-- open door doodle -->
      <g transform="translate(74 -10)">
        <rect x="0" y="-52" width="64" height="104" fill="#FFFCF7" stroke="#1E1E1E" stroke-width="5"/>
        <path d="M0 -52 L 46 -38 L 46 66 L 0 52 Z" fill="#0061FF" stroke="#1E1E1E" stroke-width="5" stroke-linejoin="round"/>
        <circle cx="36" cy="10" r="4.5" fill="#FFFCF7"/>
        <!-- light rays from the open door -->
        <path d="M72 -34 l16 -10 M76 0 h19 M72 34 l16 10" stroke="#E23E07" stroke-width="5" stroke-linecap="round"/>
      </g>
      <!-- pennant flag on top -->
      <g transform="translate(-8 -54)">
        <path d="M0 0 V -56" stroke="#1E1E1E" stroke-width="5" stroke-linecap="round"/>
        <path d="M0 -56 L 58 -44 L 0 -30 Z" fill="#F2E5B9" stroke="#1E1E1E" stroke-width="4" stroke-linejoin="round"/>
      </g>
      <text x="0" y="92" text-anchor="middle" font-family="'Space Mono',monospace" font-weight="700" font-size="17" letter-spacing="2.4" fill="#E23E07">DOORS OPEN</text>
    </g>

    <!-- confetti specks near the end -->
    <g stroke-linecap="round">
      <path d="M1424 92 l10 -8" stroke="#FF4F14" stroke-width="5"/>
      <path d="M1456 140 l12 2" stroke="#0061FF" stroke-width="5"/>
      <path d="M1432 196 l9 9" stroke="#1E1E1E" stroke-width="5"/>
      <circle cx="1472" cy="86" r="5" fill="#F2E5B9" stroke="#1E1E1E" stroke-width="3"/>
      <circle cx="1500" cy="180" r="4" fill="#FF4F14"/>
    </g>

    <!-- small checkmarks ticked along the route -->
    <path d="M548 252 l9 10 17 -20" stroke="#E23E07" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M1040 218 l9 10 17 -20" stroke="#E23E07" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </svg>

  <div class="tape t1"></div>
  <div class="tape t2"></div>
  <div class="strip"><i></i><i class="o"></i><i class="c"></i><i></i><i class="o"></i><i class="k"></i><i class="o"></i><i></i><i class="c"></i><i class="o"></i><i></i><i class="o"></i></div>
</div>
</body>
</html>
