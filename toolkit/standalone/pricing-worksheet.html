document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ar\"><\u002Fdiv>\n<nav class=\"tk-nav\"><div class=\"tk-in\">\n  <a class=\"tk-home\" href=\"index.html\"><svg class=\"lg\" width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"1.25\" y=\"1.25\" width=\"21.5\" height=\"21.5\" rx=\"3.5\" fill=\"#0061FF\" stroke=\"#1E1E1E\" stroke-width=\"1.5\"><\u002Frect><path d=\"M7 8h10M7 12h10M7 16h4.5\" fill=\"none\" stroke=\"#FFFCF7\" stroke-width=\"2\" stroke-linecap=\"round\"><\u002Fpath><path d=\"M14.5 16.2l1.6 1.6 2.9-2.9\" fill=\"none\" stroke=\"#FF4F14\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>Summit Toolkit<\u002Fa>\n  <div class=\"tk-links\">\n    <a href=\"lab-audit.html\" data-tool=\"audit\"><span class=\"dot\"><\u002Fspan>Lab Audit<\u002Fa>\n    <a href=\"mechanics-diagnostic.html\" data-tool=\"diag\"><span class=\"dot\"><\u002Fspan>Diagnostic<\u002Fa>\n    <a href=\"pricing-worksheet.html\" class=\"cur\" data-tool=\"pricing\"><span class=\"dot\"><\u002Fspan>Pricing<\u002Fa>\n    <a href=\"roadmap.html\" data-tool=\"roadmap\"><span class=\"dot\"><\u002Fspan>30/60/90<\u002Fa>\n    <a href=\"retention-checklist.html\" data-tool=\"retention\"><span class=\"dot\"><\u002Fspan>Retention<\u002Fa>\n    <a href=\"review.html\" class=\"onep\">One-Pager<\u002Fa>\n  <\u002Fdiv>\n<\u002Fdiv><\u002Fnav>\n<div class=\"wrap narrow\">\n\n  <div class=\"kicker-row\">\n    <div class=\"kicker\">Membership Summit <b>·<\u002Fb> June 23–25<\u002Fdiv>\n    <div class=\"tag\">Day 2<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"h1row\"><h1>The Pricing Worksheet<\u002Fh1><span class=\"picon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12.6 2.6A2 2 0 0 0 11.2 2H4a2 2 0 0 0-2 2v7.2a2 2 0 0 0 .6 1.4l8.7 8.7a2.4 2.4 0 0 0 3.4 0l6.6-6.6a2.4 2.4 0 0 0 0-3.4z\"><\u002Fpath><circle cx=\"7.5\" cy=\"7.5\" r=\"1.4\"><\u002Fcircle><\u002Fsvg><\u002Fspan><\u002Fdiv>\n  <div class=\"sub\">Price for <span class=\"annotate\">renewal<\u002Fspan>, not for the launch spike.<\u002Fdiv>\n\n  <div id=\"toolBody\">\n  <div class=\"frame taped\">\"Recurring revenue requires recurring value.\" (Me, to myself, a lot.) The price isn't what someone pays to join. It's what they re-decide, every single month, is still worth it.<\u002Fdiv>\n  <div class=\"base\" id=\"base\">From your Lab Audit: <b id=\"baseAud\"><\u002Fb> reachable · last month <b id=\"baseRev\"><\u002Fb><\u002Fdiv>\n\n  <div style=\"margin-top:16px\">\n    <div class=\"q\"><div class=\"qn\">1<\u002Fdiv><div class=\"qb\">\n      <div class=\"qt\">The value sentence<\u002Fdiv>\n      <div class=\"qd\">Finish it: <em>\"A member who stays six months will have<\u002Fem> <input type=\"text\" class=\"inline w\" id=\"value\"> <em>that they couldn't get anywhere else.\"<\u002Fem><\u002Fdiv>\n      <div class=\"qh\">If you can't finish this, the problem isn't price.<\u002Fdiv>\n    <\u002Fdiv><\u002Fdiv>\n\n    <div class=\"q\"><div class=\"qn\">2<\u002Fdiv><div class=\"qb\">\n      <div class=\"qt\">The month-9 test<\u002Fdiv>\n      <div class=\"qd\">What does your member get in month 9 that they didn't get in month 1?<textarea id=\"month9\" style=\"margin-top:8px\"><\u002Ftextarea><\u002Fdiv>\n      <div class=\"qh\">If your honest answer is \"the same thing, slightly more polished,\" that's the leak. Members aren't paying for slightly-more-polished. They're paying for what compounds.<\u002Fdiv>\n    <\u002Fdiv><\u002Fdiv>\n\n    <div class=\"q\"><div class=\"qn\">3<\u002Fdiv><div class=\"qb\">\n      <div class=\"qt\">The recurring math<\u002Fdiv>\n      <div class=\"qd\"><input type=\"text\" class=\"inline s\" id=\"members\" inputmode=\"numeric\" placeholder=\"50\"> members × $<input type=\"text\" class=\"inline s\" id=\"price\" inputmode=\"numeric\" placeholder=\"49\">/month<\u002Fdiv>\n      <div class=\"math\">\n        <div class=\"row\"><span class=\"lab\">Predictable, every month<\u002Fspan><span class=\"out\" id=\"mrr\">$ ···<\u002Fspan><\u002Fdiv>\n        <div class=\"row\"><span class=\"lab\">Across a year<\u002Fspan><span class=\"out dim\" id=\"arr\">$ ···<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"qd\" style=\"margin-top:16px\">Now your launch math: one launch nets $<input type=\"text\" class=\"inline s\" id=\"launchNet\" inputmode=\"numeric\"> and costs <input type=\"text\" class=\"inline s\" id=\"launchWeeks\" inputmode=\"numeric\"> weeks of your year.<\u002Fdiv>\n      <div class=\"qh\">Neither is wrong. They're different shapes of business. Which shape are you building?<\u002Fdiv>\n    <\u002Fdiv><\u002Fdiv>\n\n    <div class=\"q\"><div class=\"qn\">4<\u002Fdiv><div class=\"qb\">\n      <div class=\"qt\">The renewal test<\u002Fdiv>\n      <div class=\"qd\">Would the member from Q1 re-buy at this price in month 6, with no discount, no bonus, no launch push?<\u002Fdiv>\n      <div class=\"rchips\" id=\"renew\">\n        <button class=\"chip\">Yes<\u002Fbutton><button class=\"chip\">Not sure<\u002Fbutton><button class=\"chip\">No<\u002Fbutton>\n      <\u002Fdiv>\n      <div class=\"verdict\" id=\"verdict\"><\u002Fdiv>\n    <\u002Fdiv><\u002Fdiv>\n\n    <div class=\"q\"><div class=\"qn\">5<\u002Fdiv><div class=\"qb\">\n      <div class=\"qt\">Your starting point<\u002Fdiv>\n      <div class=\"qd\">$<input type=\"text\" class=\"inline s\" id=\"startMo\" inputmode=\"numeric\">/month &nbsp;or&nbsp; $<input type=\"text\" class=\"inline s\" id=\"startYr\" inputmode=\"numeric\">/year &nbsp;·&nbsp; Tiers: <input type=\"text\" class=\"inline s\" id=\"tiers\" inputmode=\"numeric\" placeholder=\"1\"><\u002Fdiv>\n      <div class=\"qh\">Start with fewer tiers than you think you need. Adding later is easy, removing is painful. Your starting price flows into your 30/60/90 roadmap.<\u002Fdiv>\n    <\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"actions\">\n    <button class=\"btn ghost\" onclick=\"window.print()\">Print this sheet<\u002Fbutton>\n  <\u002Fdiv>\n  <p class=\"hint\" style=\"margin-top:14px\">Your pricing answers feed the Day 3 work. Bring this page tomorrow.<\u002Fp>\n\n  <div class=\"next\">Next: <a href=\"roadmap.html\">Your 30/60/90 Roadmap<\u002Fa><\u002Fdiv>\n  <\u002Fdiv><!-- /toolBody -->\n\n  <div class=\"foot\"><span>A Creator Science event · creatorscience.com<\u002Fspan><img src=\"d9922341-d574-4f2e-9efb-445d635bd9dd\" alt=\"Creator Science\"><span>membershipsummit.com<\u002Fspan><\u002Fdiv>\n  <div class=\"privacy\" id=\"privacy\">Your answers live in this browser only.<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"saveflag\" id=\"saveflag\"><span class=\"sq\"><\u002Fspan>Saved in this browser<\u002Fdiv>\n\n<script src=\"01c7ce03-5feb-4e2d-b537-a1bd49558285\"><\u002Fscript>\n<script src=\"cb88432c-ef9c-49a3-b03d-9a8b51cd7bfe\"><\u002Fscript>\n<script>\nconst num=v=>{const n=parseFloat(String(v||\"\").replace(/[^0-9.]/g,\"\"));return isNaN(n)?0:n};\nfunction math(){\n  const p=store.all().pricing||{};\n  const m=num(p.members),pr=num(p.price);\n  document.getElementById(\"mrr\").innerHTML=(m&&pr)?\"$\"+(m*pr).toLocaleString()+\" <span>/month, predictable<\u002Fspan>\":\"$ ···\";\n  document.getElementById(\"arr\").innerHTML=(m&&pr)?\"$\"+(m*pr*12).toLocaleString()+\" <span>/year<\u002Fspan>\":\"$ ···\";\n}\nconst FIELDS=[\"value\",\"month9\",\"members\",\"price\",\"launchNet\",\"launchWeeks\",\"startMo\",\"startYr\",\"tiers\"];\nFIELDS.forEach(id=>{\n  document.getElementById(id).addEventListener(\"input\",e=>{\n    store.set(\"pricing\",{[id]:e.target.value.trim()});math();paintNav();\n  });\n});\n/* renewal chips */\nconst VERDICT={\n  \"Yes\":\"Then the number holds. Write it in Q5 and stop second-guessing it.\",\n  \"Not sure\":\"Sit with Q2 again. The month-9 answer usually settles this one.\",\n  \"No\":\"If it's not yes, the fix is value design, not a lower number.\"\n};\ndocument.getElementById(\"renew\").addEventListener(\"click\",e=>{\n  const b=e.target.closest(\".chip\");if(!b)return;\n  document.querySelectorAll(\"#renew .chip\").forEach(x=>x.classList.toggle(\"on\",x===b));\n  store.set(\"pricing\",{renew:b.textContent});\n  const v=document.getElementById(\"verdict\");v.style.display=\"block\";v.textContent=VERDICT[b.textContent];\n  paintNav();\n});\n/* restore */\n(function(){\n  const s=store.all(),p=s.pricing||{},a=s.audit||{};\n  FIELDS.forEach(id=>{if(p[id])document.getElementById(id).value=p[id]});\n  if(p.renew){document.querySelectorAll(\"#renew .chip\").forEach(x=>x.classList.toggle(\"on\",x.textContent===p.renew));\n    const v=document.getElementById(\"verdict\");v.style.display=\"block\";v.textContent=VERDICT[p.renew];}\n  if(a.audience||a.revenue){\n    document.getElementById(\"base\").style.display=\"block\";\n    document.getElementById(\"baseAud\").textContent=a.audience||\"···\";\n    document.getElementById(\"baseRev\").textContent=a.revenue||\"···\";\n  }\n  math();paintNav();\n})();\nmountDrip(\"pricing\",\"toolBody\",\"Pricing lands after the Day 2 teaching. The math only makes sense once you\\u2019ve heard it.\");\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
