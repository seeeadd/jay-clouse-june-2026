.vsl-poster-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(30,30,30,0.22) 0%, rgba(30,30,30,0.8) 100%);
}
.vsl-poster-cornerLabel {
  position: absolute; top: 16px; left: 18px;
  display: flex; align-items: center; gap: 8px;
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--cs-notebook); font-weight: 700;
}
.vsl-poster-cornerLabel .dot {
  width: 8px; height: 8px; border-radius: 50%; background: var(--cs-recording);
  animation: pulse 1.8s infinite;
}
.vsl-poster-play {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  width: 92px; height: 92px; border-radius: 50%;
  background: var(--cs-recording); color: var(--cs-notebook);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 0 6px rgba(255,252,247,0.3), 0 10px 30px rgba(0,0,0,0.35);
  padding-left: 6px;
  transition: transform .18s ease;
}
.vsl-poster-play svg { width: 38px; height: 38px; }
.vsl-poster:hover .vsl-poster-play { transform: translate(-50%, -50%) scale(1.06); }
.vsl-poster-caption {
  position: absolute; bottom: 18px; left: 20px; right: 20px;
  color: var(--cs-notebook); text-align: left;
}
.vsl-poster-time {
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em;
  text-transform: uppercase; opacity: 0.7; margin-bottom: 6px;
}
.vsl-poster-title {
  font-family: var(--font-display); font-size: 20px; font-weight: 500;
  letter-spacing: -0.01em; line-height: 1.2;
}

.vsl-note {
  margin-top: 14px; font-family: var(--font-hand); font-size: 22px;
  color: var(--cs-static-60); transform: rotate(-1deg); text-align: left;
  padding-left: 20px;
}

/* =========================================================
   POPUP
   ========================================================= */
.popup-overlay {
  position: fixed; inset: 0; z-index: 500;
  background: rgba(30,30,30,0.78);
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  animation: overlayIn .3s ease;
}
@keyframes overlayIn { from { opacity: 0; } to { opacity: 1; } }
.popup-card {
  position: relative; width: 100%; max-width: 480px;
  background: var(--cs-notebook); border: 3px solid var(--cs-static);
  box-shadow: 12px 12px 0 var(--cs-ballpoint);
  padding: 36px 32px 28px;
  animation: popupIn .35s cubic-bezier(.2,.8,.2,1.1);
  transform-origin: center;
}
@keyframes popupIn { from { opacity: 0; transform: translateY(20px) scale(0.96); } to { opacity: 1; transform: none; } }
.popup-close {
  position: absolute; top: 8px; right: 12px; background: transparent; border: 0;
  font-size: 28px; line-height: 1; cursor: pointer; color: var(--cs-static);
  width: 36px; height: 36px;
}
.popup-tape {
  position: absolute; top: -14px; width: 88px; height: 22px;
  background: var(--cs-cellotape); border: 1px dashed rgba(30,30,30,0.22);
}
.popup-tape-l { left: 28px; transform: rotate(-3deg); }
.popup-tape-r { right: 40px; transform: rotate(2deg); }

.popup-kicker {
  font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--cs-ballpoint); font-weight: 700;
  margin-bottom: 10px;
}
.popup-title {
  font-family: var(--font-display); font-size: 28px; font-weight: 600;
  line-height: 1.1; letter-spacing: -0.02em; margin: 0 0 12px;
  text-wrap: balance;
}
.popup-sub {
  font-size: 15.5px; line-height: 1.55; color: rgba(30,30,30,0.78);
  margin: 0 0 22px;
}
.popup-form { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
.popup-form input {
  font-family: var(--font-text); font-size: 16px;
  padding: 13px 14px; border: 2px solid var(--cs-static);
  background: var(--cs-notebook); color: var(--cs-static); width: 100%;
}
.popup-form input:focus { outline: none; border-color: var(--cs-ballpoint); }
.popup-cta {
  font-family: var(--font-mono); text-transform: uppercase;
  letter-spacing: var(--tracking-caps); font-size: 13px; font-weight: 700;
  padding: 15px 20px; border: 2px solid var(--cs-static);
  background: var(--cs-ballpoint); color: var(--cs-notebook);
  cursor: pointer; box-shadow: 4px 4px 0 var(--cs-static);
  transition: transform .12s ease, box-shadow .12s ease;
}
.popup-cta:hover { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 var(--cs-static); }
.popup-fine {
  display: flex; gap: 14px; flex-wrap: wrap;
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--cs-static-60); margin-bottom: 18px;
}
.popup-sig {
  display: flex; align-items: center; gap: 12px;
  padding-top: 14px; border-top: 1.5px dashed rgba(30,30,30,0.2);
}
.popup-sig img { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--cs-static); filter: saturate(0.9); }
.popup-sig span { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--cs-static-60); line-height: 1.6; }
.popup-sig strong { color: var(--cs-static); }

.popup-done { text-align: center; padding: 12px 0; }
.popup-done-stamp {
  display: inline-block; font-family: var(--font-mono); font-weight: 700;
  letter-spacing: 0.22em; font-size: 13px; padding: 10px 18px;
  border: 2.5px solid var(--cs-recording); color: var(--cs-recording);
  transform: rotate(-3deg); margin-bottom: 18px;
}
.popup-done-title {
  font-family: var(--font-display); font-size: 26px; font-weight: 600;
  line-height: 1.15; margin: 0 0 12px; letter-spacing: -0.02em;
}
.popup-done-sub { font-size: 15px; line-height: 1.55; color: rgba(30,30,30,0.75); margin: 0 0 20px; }

/* =========================================================
   PROOF STRIP
   ========================================================= */
.proof-strip {
  background: var(--cs-static); color: var(--cs-notebook);
  padding: 36px 24px; position: relative;
}
.proof-strip-inner {
  max-width: 1100px; margin: 0 auto;
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px;
  padding-bottom: 24px; border-bottom: 1.5px dashed rgba(255,252,247,0.2);
}
.proof-item { text-align: center; }
.proof-n {
  font-family: var(--font-display); font-size: clamp(32px, 4vw, 44px);
  font-weight: 700; line-height: 1; letter-spacing: -0.02em;
  color: var(--cs-cellotape);
}
.proof-l {
  font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.14em;
  text-transform: uppercase; margin-top: 8px; color: rgba(255,252,247,0.7);
}
.proof-strip-seen {
  max-width: 1100px; margin: 20px auto 0;
  display: flex; gap: 28px; flex-wrap: wrap; align-items: center; justify-content: center;
  font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.14em;
  text-transform: uppercase; color: rgba(255,252,247,0.55);
}
.proof-logo {
  font-family: var(--font-display); font-size: 17px; font-weight: 600;
  letter-spacing: -0.015em; color: rgba(255,252,247,0.85);
  text-transform: none;
}
@media (max-width: 720px) { .proof-strip-inner { grid-template-columns: repeat(2, 1fr); } }

/* =========================================================
   FOR YOU
   ========================================================= */
.foryou { background: var(--cs-notebook); }
.foryou-eyebrow {
  font-family: var(--font-hand); font-size: 30px; color: var(--cs-static-60);
  transform: rotate(-1.5deg); display: inline-block; margin-bottom: 6px;
}
.foryou-h2 {
  font-family: var(--font-display); font-size: clamp(34px, 4.4vw, 54px);
  font-weight: 500; line-height: 1.08; letter-spacing: -0.025em;
  margin: 8px 0 48px; max-width: 820px;
}
.foryou-cols {
  display: grid; grid-template-columns: 1fr 1fr; gap: 56px; align-items: start;
}
@media (max-width: 860px) { .foryou-cols { grid-template-columns: 1fr; gap: 40px; } }
.foryou-col ul { list-style: none; padding: 0; margin: 14px 0 0; display: flex; flex-direction: column; gap: 12px; }
.foryou-col li { display: flex; gap: 14px; align-items: flex-start; font-size: 17.5px; line-height: 1.5; }
.foryou-col-head { display: flex; align-items: center; gap: 10px; }
.foryou-col-hand {
  font-family: var(--font-hand); font-size: 30px; color: var(--cs-ballpoint);
  display: inline-block; transform: rotate(-2deg);
}
.yes-check { font-family: var(--font-hand); font-size: 28px; color: var(--cs-ballpoint); line-height: 1; flex-shrink: 0; margin-top: -2px; display: inline-block; }
.no-x { font-family: var(--font-hand); font-size: 24px; color: var(--cs-recording); line-height: 1; flex-shrink: 0; display: inline-block; }
.foryou-no li { color: rgba(30,30,30,0.75); font-size: 16.5px; }

.foryou-ps {
  margin-top: 48px; padding-top: 20px;
  border-top: 1.5px dashed rgba(30,30,30,0.2);
  font-family: var(--font-hand); font-size: 24px; color: var(--cs-static-60);
  max-width: 640px; transform: rotate(-0.3deg);
}

/* =========================================================
   DARK MID CTA
   ========================================================= */
.dark-mid {
  background: var(--cs-static); color: var(--cs-notebook);
  padding: 72px 24px;
}
.darkmid-kicker {
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.2em;
  text-transform: uppercase; color: var(--cs-cellotape); font-weight: 700;
  margin-bottom: 20px;
}
.darkmid-h2 {
  font-family: var(--font-display); font-size: clamp(38px, 5vw, 64px);
  font-weight: 600; line-height: 1.05; letter-spacing: -0.025em;
  color: var(--cs-notebook); margin: 0 0 20px;
}
.darkmid-h2 em { color: var(--cs-cellotape); font-style: italic; font-weight: 400; }
.darkmid-sub {
  font-size: 17.5px; line-height: 1.6; max-width: 600px; margin: 0 auto 32px;
  color: rgba(255,252,247,0.82);
}

/* =========================================================
   STORY
   ========================================================= */
.story { background: var(--cs-notebook); }
.story-grid { display: grid; grid-template-columns: 0.8fr 1fr; gap: 64px; align-items: center; }
@media (max-width: 860px) { .story-grid { grid-template-columns: 1fr; gap: 40px; } }
.story-media { display: flex; flex-direction: column; align-items: center; }
.story-photo {
  aspect-ratio: 1; width: 100%;
  background-size: cover; background-position: center 22%;
  filter: grayscale(0.6) contrast(1.05);
}
.story-eyebrow {
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.18em;
  text-transform: uppercase; color: var(--cs-recording); font-weight: 700;
  margin-bottom: 16px;
}
.story-h2 {
  font-family: var(--font-display); font-size: clamp(34px, 4.4vw, 52px);
  font-weight: 600; line-height: 1.08; letter-spacing: -0.025em; margin: 0 0 20px;
}
.story-text p { font-size: 17.5px; line-height: 1.65; margin: 0 0 16px; color: var(--cs-static); }
.story-em {
  padding-left: 16px; border-left: 3px solid var(--cs-ballpoint);
  font-size: 19px; line-height: 1.55; color: var(--cs-static); font-weight: 500;
}
.story-em em { color: var(--cs-ballpoint); font-style: italic; }

/* Index card + polaroid */
.illus-polaroid {
  background: var(--cs-notebook); border: 2px solid var(--cs-static);
  padding: 12px 12px 18px; box-shadow: 8px 8px 0 var(--cs-static);
}
.illus-polaroid-img { aspect-ratio: 1; overflow: hidden; background: var(--cs-cellotape); }
.illus-polaroid-caption {
  font-family: var(--font-hand); font-size: 20px; color: var(--cs-static);
  text-align: center; margin-top: 12px; transform: rotate(-1deg);
}
.illus-indexcard {
  border: 2px solid var(--cs-static); padding: 18px 20px 22px; position: relative;
  box-shadow: 6px 6px 0 var(--cs-static);
}
.illus-indexcard-hl {
  position: absolute; top: 0; left: 28px; width: 2px; bottom: 0;
  background: var(--cs-recording); opacity: 0.5;
}
.illus-indexcard-pin {
  position: absolute; top: -10px; left: 24px; width: 14px; height: 14px;
  border-radius: 50%; background: var(--cs-recording);
  border: 2px solid var(--cs-static);
  box-shadow: inset -2px -2px 0 rgba(0,0,0,0.25);
}
.illus-indexcard-body { padding-left: 22px; }
.ic-hand {
  font-family: var(--font-hand); font-size: 22px; line-height: 1.3;
  color: var(--cs-static); margin-bottom: 4px;
}

/* Stamp */
.illus-stamp {
  display: inline-block; font-family: var(--font-mono); font-weight: 700;
  letter-spacing: 0.2em; font-size: 11px; padding: 6px 12px;
  border: 2.5px solid var(--c, var(--cs-recording));
  color: var(--c, var(--cs-recording)); text-transform: uppercase;
}

/* =========================================================
   NEWSPAPER
   ========================================================= */
.news { background: var(--cs-cellotape); }
.news-clip {
  background: var(--cs-notebook); border: 2px solid var(--cs-static);
  padding: 28px 32px 24px;
  box-shadow: 10px 10px 0 var(--cs-static);
  transform: rotate(-0.6deg);
  position: relative;
}
.news-clip::before, .news-clip::after {
  content: ""; position: absolute;
  background: repeating-linear-gradient(-45deg, transparent 0 6px, var(--cs-cellotape) 6px 12px);
}
.news-masthead {
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  padding-bottom: 10px; border-bottom: 2px solid var(--cs-static);
  font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.14em;
  text-transform: uppercase; font-weight: 700; color: var(--cs-static); flex-wrap: wrap;
}
.news-masthead-c { color: var(--cs-recording); }
.news-headline {
  font-family: var(--font-display); font-size: clamp(26px, 3.8vw, 44px);
  font-weight: 700; line-height: 1.08; letter-spacing: -0.02em;
  text-align: center; margin: 18px 0 10px; text-wrap: balance;
}
.news-subhead {
  font-family: var(--font-display); font-style: italic; font-size: 17px; line-height: 1.4;
  text-align: center; color: var(--cs-static); max-width: 720px; margin: 0 auto 20px;
}
.news-columns {
  column-count: 2; column-gap: 28px; column-rule: 1px solid rgba(30,30,30,0.2);
  border-top: 1.5px solid var(--cs-static); padding-top: 18px;
}
@media (max-width: 720px) { .news-columns { column-count: 1; } }
.news-col p { font-size: 15px; line-height: 1.55; margin: 0 0 12px; color: var(--cs-static); }
.news-col em { font-style: italic; color: var(--cs-recording); }
.news-footer {
  display: flex; justify-content: space-between; align-items: center; gap: 16px;
  margin-top: 18px; padding-top: 16px; border-top: 2px solid var(--cs-static);
  font-family: var(--font-hand); font-size: 22px; color: var(--cs-static-60); flex-wrap: wrap;
}
.news-cta {
  font-family: var(--font-mono); font-weight: 700; letter-spacing: 0.18em;
  font-size: 12px; padding: 12px 18px; background: var(--cs-static);
  color: var(--cs-notebook); border: 2px solid var(--cs-static); cursor: pointer;
  box-shadow: 4px 4px 0 var(--cs-recording); text-transform: uppercase;
  transition: transform .12s, box-shadow .12s;
}
.news-cta:hover { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 var(--cs-recording); }

/* =========================================================
   CHALLENGE INTRO
   ========================================================= */
.ch-intro { background: var(--cs-notebook); }
.ch-intro-kicker {
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.2em;
  text-transform: uppercase; color: var(--cs-recording); font-weight: 700;
  margin-bottom: 16px;
}
.ch-intro-h2 {
  font-family: var(--font-display); font-size: clamp(36px, 4.8vw, 58px);
  font-weight: 600; line-height: 1.06; letter-spacing: -0.025em; margin: 0 0 36px;
}
.ch-intro-sub-h { font-weight: 400; font-style: italic; color: var(--cs-static-60); }
.ch-intro-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px;
  margin: 40px 0;
}
@media (max-width: 860px) { .ch-intro-grid { grid-template-columns: 1fr; } }
.ch-intro-block {
  border-top: 2px solid var(--cs-static); padding: 18px 0 0;
}
.ch-intro-num {
  font-family: var(--font-display); font-size: 42px; font-weight: 700;
  color: var(--cs-ballpoint); letter-spacing: -0.02em; line-height: 1; margin-bottom: 12px;
}
.ch-intro-block h4 {
  font-family: var(--font-display); font-size: 22px; font-weight: 600;
  line-height: 1.2; letter-spacing: -0.015em; margin: 0 0 10px;
}
.ch-intro-block p { font-size: 16px; line-height: 1.55; color: rgba(30,30,30,0.78); margin: 0; }

.ch-intro-cta-row { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; margin-top: 16px; }
.ch-intro-cta-fine {
  font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--cs-static-60);
}

/* =========================================================
   BIG IDEA
   ========================================================= */
.bigidea {
  background: var(--cs-static); color: var(--cs-notebook);
  padding: 96px 0;
}
.bigidea-kicker {
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.16em;
  text-transform: uppercase; color: rgba(255,252,247,0.5); margin-bottom: 24px;
}
.bigidea-h2 {
  font-family: var(--font-display); font-size: clamp(42px, 6vw, 84px);
  font-weight: 400; line-height: 1.05; letter-spacing: -0.03em; margin: 0;
  color: var(--cs-notebook);
}
.bigidea-em { font-style: italic; color: var(--cs-cellotape); }
.bigidea-hl { color: var(--cs-cellotape); }
.bigidea-attrib {
  margin-top: 32px; font-family: var(--font-mono); font-size: 12px;
  letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,252,247,0.55);
}

/* =========================================================
   DAYS — deep
   ========================================================= */
.days { background: var(--cs-notebook); }
.days-h2 {
  font-family: var(--font-display); font-size: clamp(36px, 4.8vw, 56px);
  font-weight: 600; line-height: 1.08; letter-spacing: -0.025em;
  margin: 14px auto 14px; text-align: center; max-width: 820px;
}
.days-sub {
  font-size: 17px; line-height: 1.6; max-width: 620px;
  margin: 0 auto 56px; text-align: center; color: rgba(30,30,30,0.75);
}
.day-cards { display: flex; flex-direction: column; gap: 40px; max-width: 1000px; margin: 0 auto; }

.day-card {
  display: grid; grid-template-columns: 140px 1fr; gap: 0;
  border: 2px solid var(--cs-static);
  background: var(--cs-notebook);
  box-shadow: 10px 10px 0 var(--day-accent, var(--cs-ballpoint));
  position: relative;
}
@media (max-width: 720px) { .day-card { grid-template-columns: 1fr; } }

.day-badge {
  background: var(--day-accent, var(--cs-ballpoint));
  border-right: 2px solid var(--cs-static);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 24px 12px; position: relative;
  color: var(--cs-notebook);
}
.day-card[style*="cellotape"] .day-badge { color: var(--cs-static); }
.day-badge-num {
  font-family: var(--font-display); font-size: 88px; font-weight: 700;
  line-height: 0.9; letter-spacing: -0.04em;
}
.day-badge-label {
  font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.3em;
  text-transform: uppercase; font-weight: 700; margin-top: 4px;
}
@media (max-width: 720px) {
  .day-badge { flex-direction: row; gap: 14px; border-right: 0; border-bottom: 2px solid var(--cs-static); padding: 16px 20px; }
  .day-badge-num { font-size: 48px; }
}

.day-body { padding: 28px 32px 28px; }
.day-head {
  display: flex; justify-content: space-between; align-items: center;
  gap: 12px; flex-wrap: wrap;
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.16em;
  text-transform: uppercase; font-weight: 700;
}
.day-topic-label { color: var(--cs-recording); }
.day-date { color: var(--cs-static-60); }
.day-title {
  font-family: var(--font-display); font-size: clamp(24px, 2.8vw, 32px);
  font-weight: 600; line-height: 1.15; letter-spacing: -0.02em;
  margin: 10px 0 10px;
}
.day-lede {
  font-size: 16.5px; line-height: 1.55; color: rgba(30,30,30,0.78);
  margin: 0 0 18px;
}

.day-meta-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 22px; }
.day-meta-tag {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 10px; border: 1.5px solid var(--cs-static);
  font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.1em;
  text-transform: uppercase; font-weight: 700; color: var(--cs-static);
  background: var(--cs-notebook);
}
.day-icon { display: inline-flex; width: 14px; height: 14px; }
.day-icon svg { width: 100%; height: 100%; }

.day-topics-block {
  background: rgba(242,229,185,0.35); border: 1.5px solid var(--cs-static);
  padding: 16px 20px; margin-bottom: 20px;
}
.day-topics-head {
  font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.18em;
  text-transform: uppercase; font-weight: 700; color: var(--cs-static-60);
  margin-bottom: 10px;
}
.day-topics-block ul { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 6px 24px; }
@media (max-width: 720px) { .day-topics-block ul { grid-template-columns: 1fr; } }
.day-topics-block li {
  display: flex; gap: 10px; align-items: flex-start;
  font-size: 15px; line-height: 1.5;
}
.t-check {
  font-weight: 700; color: var(--cs-ballpoint); flex-shrink: 0;
  margin-top: 1px;
}

.day-walkaway, .day-reveal, .day-fear {
  padding: 14px 18px; border-left: 3px solid var(--day-accent, var(--cs-ballpoint));
  background: rgba(30,30,30,0.03); margin-bottom: 14px;
}
.dw-label, .dr-label, .df-label {
  display: block; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.2em;
  text-transform: uppercase; font-weight: 700; color: var(--cs-static-60); margin-bottom: 4px;
}
.dw-text { font-size: 15.5px; line-height: 1.55; color: var(--cs-static); font-weight: 500; }
.dr-text { font-size: 15.5px; line-height: 1.55; color: var(--cs-static); font-style: italic; }
.day-reveal { border-left-color: var(--cs-recording); background: rgba(255,79,20,0.05); }
.dr-label { color: var(--cs-recording); }
.df-text { font-size: 15.5px; line-height: 1.55; color: var(--cs-static-60); font-style: italic; }

.day-cta-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-top: 20px; }
.day-cta-fine {
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--cs-static-60);
}

/* =========================================================
   CHAD
   ========================================================= */
.chad { background: var(--cs-ballpoint); color: var(--cs-notebook); }
.chad-grid { display: grid; grid-template-columns: 0.8fr 1fr; gap: 64px; align-items: center; }
@media (max-width: 860px) { .chad-grid { grid-template-columns: 1fr; gap: 40px; } }
.chad-media { position: relative; display: flex; justify-content: center; }
.chad-photo {
  aspect-ratio: 1; background: var(--cs-static);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-display); font-size: 120px; font-weight: 700;
  color: rgba(255,252,247,0.25);
}
.chad-stamp { position: absolute; top: -20px; left: -20px; }
.chad-eyebrow {
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.18em;
  text-transform: uppercase; color: var(--cs-cellotape); font-weight: 700;
  margin-bottom: 16px;
}
.chad-h2 {
  font-family: var(--font-display); font-size: clamp(32px, 4.4vw, 52px);
  font-weight: 600; line-height: 1.1; letter-spacing: -0.025em;
  color: var(--cs-notebook); margin: 0 0 20px;
}
.chad-hl { color: var(--cs-cellotape); }
.chad p { font-size: 17.5px; line-height: 1.6; color: rgba(255,252,247,0.88); margin: 0 0 16px; max-width: 560px; }
.chad-em { font-style: italic; }

/* =========================================================
   TESTIMONIALS MARQUEE
   ========================================================= */
.test-sec { background: var(--cs-notebook); overflow: hidden; }
.test-h2 {
  font-family: var(--font-display); font-size: clamp(32px, 4.4vw, 52px);
  font-weight: 600; line-height: 1.08; letter-spacing: -0.025em;
  margin: 16px auto 48px; text-align: center; max-width: 820px;
}
.test-marquee { overflow: hidden; position: relative; }
.test-marquee::before, .test-marquee::after {
  content:""; position: absolute; top: 0; bottom: 0; width: 60px; z-index: 2;
  pointer-events: none;
}
.test-marquee::before { left: 0; background: linear-gradient(90deg, var(--cs-notebook), transparent); }
.test-marquee::after { right: 0; background: linear-gradient(-90deg, var(--cs-notebook), transparent); }
.test-track {
  display: flex; gap: 24px;
  animation: marquee 60s linear infinite;
  width: max-content;
}
@keyframes marquee {
  from { transform: translateX(0); }
  to { transform: translateX(-50%); }
}
.test-card {
  width: 340px; flex-shrink: 0;
  background: var(--cs-notebook); border: 2px solid var(--cs-static);
  padding: 22px 22px 20px; box-shadow: 6px 6px 0 var(--cs-ballpoint);
  display: flex; flex-direction: column; gap: 16px;
}
.test-quote-mark {
  font-family: var(--font-display); font-size: 54px; font-weight: 700;
  line-height: 0.5; color: var(--cs-recording); height: 18px;
}
.test-quote { font-size: 15.5px; line-height: 1.55; margin: 0; color: var(--cs-static); flex: 1; }
.test-meta { display: flex; align-items: center; gap: 12px; margin-top: auto; padding-top: 12px; border-top: 1.5px dashed rgba(30,30,30,0.2); }
.test-avatar {
  width: 38px; height: 38px; border-radius: 50%;
  background: var(--cs-cellotape); border: 2px solid var(--cs-static);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-mono); font-size: 11px; font-weight: 700; letter-spacing: 0.06em;
}
.test-name { font-family: var(--font-display); font-size: 14.5px; font-weight: 600; line-height: 1.2; }
.test-role { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--cs-static-60); margin-top: 2px; }

/* =========================================================
   WHO'S COMING
   ========================================================= */
.whos { background: var(--cs-notebook); }
.whos-grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: 56px; align-items: center; }
@media (max-width: 860px) { .whos-grid { grid-template-columns: 1fr; } }
.whos-h2 {
  font-family: var(--font-display); font-size: clamp(30px, 4vw, 48px);
  font-weight: 600; line-height: 1.1; letter-spacing: -0.02em; margin: 18px 0;
}
.whos-p { font-size: 17px; line-height: 1.6; color: rgba(30,30,30,0.78); margin-bottom: 28px; max-width: 460px; }
.whos-stats { display: flex; gap: 28px; flex-wrap: wrap; }
.whos-stats div b {
  display: block; font-family: var(--font-display); font-size: 34px; font-weight: 700;
  line-height: 1; letter-spacing: -0.02em;
}
.whos-stats div span {
  font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--cs-static-60); margin-top: 6px; display: block;
}
.whos-feed-wrap {
  border: 2px solid var(--cs-static); padding: 18px;
  background: var(--cs-notebook); box-shadow: 6px 6px 0 var(--cs-ballpoint);
}
.whos-feed-head {
  display: flex; justify-content: space-between; align-items: center;
  font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--cs-static-60); margin-bottom: 12px;
  padding-bottom: 10px; border-bottom: 1.5px dashed rgba(30,30,30,0.2);
}
.whos-feed-live { display: inline-flex; align-items: center; gap: 8px; color: var(--cs-recording); font-weight: 700; }
.whos-feed-live .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--cs-recording); animation: pulse 1.8s infinite; }

.feed-row {
  display: flex; align-items: center; gap: 10px;
  font-family: var(--font-mono); font-size: 11px; text-transform: uppercase;
  letter-spacing: 0.06em; padding: 8px 12px;
  border: 1.5px solid rgba(30,30,30,0.15);
  background: rgba(255,252,247,0.6);
  animation: slideIn .5s ease;
}
@keyframes slideIn { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: none; } }
.feed-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--cs-recording); }
.feed-name { font-weight: 700; }
.feed-kind { flex: 1; color: var(--cs-static-60); }
.feed-age { opacity: 0.5; letter-spacing: 0; }

/* =========================================================
   WHO'S COMING v2 — "Find yourself in the room" filter
   ========================================================= */
.whos-h2-v2 { max-width: 820px; margin: 18px 0 14px; }
.whos-p-v2 { max-width: 640px; margin-bottom: 32px; font-size: 17.5px; }
.whos-p-v2 b { font-weight: 700; color: var(--cs-static); }
.whos-stats-v2 { margin-top: 48px; padding-top: 28px; border-top: 1.5px dashed rgba(30,30,30,0.15); }

/* Chip rail */
.roster-chips {
  display: flex; flex-wrap: wrap; gap: 8px;
  margin-bottom: 32px;
}
.roster-chip {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 10px 14px 10px 16px;
  background: var(--cs-notebook);
  border: 1.5px solid rgba(30,30,30,0.18);
  border-radius: 999px;
  font-family: var(--font-mono); font-size: 11.5px;
  letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--cs-static-80);
  cursor: pointer;
  transition: transform .14s ease, border-color .14s ease, background .14s ease, color .14s ease;
}
.roster-chip:hover {
  border-color: var(--cs-static); transform: translateY(-1px);
}
.roster-chip .rc-label { font-weight: 700; }
.roster-chip .rc-count {
  font-family: var(--font-display); font-weight: 700; font-size: 12px;
  background: rgba(30,30,30,0.08);
  color: var(--cs-static-80);
  padding: 3px 8px; border-radius: 999px;
  letter-spacing: 0; text-transform: none;
  transition: background .14s ease, color .14s ease;
}
.roster-chip.is-active {
  background: var(--cs-static);
  border-color: var(--cs-static);
  color: var(--cs-notebook);
}
.roster-chip.is-active .rc-count {
  background: var(--cs-recording);
  color: var(--cs-notebook);
}

/* Result panel */
.roster-panel {
  position: relative;
  background: var(--cs-notebook);
  border: 2px solid var(--cs-static);
  border-radius: 4px;
  padding: 28px 28px 24px;
  box-shadow: 8px 8px 0 var(--cs-recording);
  animation: rosterFade .32s ease;
}
@keyframes rosterFade {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: none; }
}
.roster-panel-head {
  display: grid; grid-template-columns: auto 1fr auto; gap: 20px; align-items: end;
  padding-bottom: 22px; margin-bottom: 22px;
  border-bottom: 1.5px dashed rgba(30,30,30,0.18);
}
.roster-panel-count {
  font-family: var(--font-display);
  font-size: clamp(22px, 2.6vw, 30px);
  font-weight: 600;
  line-height: 1.05;
  letter-spacing: -0.02em;
}
.roster-panel-count b {
  font-weight: 800; color: var(--cs-recording); font-size: 1.3em;
}
.roster-panel-blurb {
  font-family: var(--font-serif);
  font-style: italic;
  font-size: 17px; line-height: 1.45;
  color: var(--cs-static-80);
  max-width: 46ch;
}
.roster-panel-hand {
  font-family: var(--font-hand);
  font-size: 22px; line-height: 1;
  color: var(--cs-ballpoint);
  transform: rotate(-2deg);
  white-space: nowrap;
  margin-bottom: 2px;
}
@media (max-width: 760px) {
  .roster-panel-head { grid-template-columns: 1fr; gap: 10px; }
  .roster-panel-hand { transform: rotate(-1deg); justify-self: start; margin-top: 4px; }
}

.roster-cards {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}
@media (max-width: 860px) { .roster-cards { grid-template-columns: 1fr; } }

.roster-card {
  position: relative;
  background: var(--cs-notebook);
  border: 1.5px solid rgba(30,30,30,0.15);
  border-radius: 3px;
  padding: 18px 18px 20px;
  animation: rosterCard .45s cubic-bezier(.2,.7,.3,1.1) backwards;
}
.roster-card:nth-child(1) { transform: rotate(-0.4deg); }
.roster-card:nth-child(2) { transform: rotate(0.3deg); }
.roster-card:nth-child(3) { transform: rotate(-0.2deg); }
.roster-card::before {
  content: ""; position: absolute; top: -8px; left: 50%;
  width: 44px; height: 14px; transform: translateX(-50%) rotate(-2deg);
  background: var(--cs-cellotape); opacity: 0.85;
  border-left: 1px solid rgba(30,30,30,0.08);
  border-right: 1px solid rgba(30,30,30,0.08);
}
@keyframes rosterCard {
  from { opacity: 0; transform: translateY(10px) rotate(0); }
  to   { opacity: 1; }
}

.rcard-head {
  display: grid; grid-template-columns: auto 1fr auto; gap: 10px;
  align-items: center;
  padding-bottom: 12px; margin-bottom: 12px;
  border-bottom: 1px solid rgba(30,30,30,0.1);
}
.rcard-avatar {
  width: 38px; height: 38px; border-radius: 50%;
  background: var(--cs-cellotape); color: var(--cs-static);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-mono); font-weight: 700; font-size: 11px;
  letter-spacing: 0.04em;
  border: 1.5px solid var(--cs-static);
}
.roster-card:nth-child(1) .rcard-avatar { background: #F2C6A4; }
.roster-card:nth-child(2) .rcard-avatar { background: #C4D4E8; }
.roster-card:nth-child(3) .rcard-avatar { background: #E8D4C4; }

.rcard-name {
  font-family: var(--font-display); font-weight: 700;
  font-size: 17px; line-height: 1.1; color: var(--cs-static);
}
.rcard-size {
  font-family: var(--font-mono); font-size: 10.5px;
  letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--cs-static-60); margin-top: 2px;
}
.rcard-tag {
  font-family: var(--font-mono); font-size: 10.5px; font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--cs-recording);
  border: 1px solid var(--cs-recording);
  padding: 3px 7px; border-radius: 3px;
}
.rcard-label {
  font-family: var(--font-mono); font-size: 10px; font-weight: 700;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--cs-static-60); margin-bottom: 6px;
}
.rcard-stuck {
  font-family: var(--font-serif);
  font-size: 15.5px; line-height: 1.5;
  color: var(--cs-static-80);
  margin: 0;
}

.roster-foot {
  display: flex; justify-content: space-between; align-items: center;
  gap: 20px; flex-wrap: wrap;
  margin-top: 24px; padding-top: 18px;
  border-top: 1.5px dashed rgba(30,30,30,0.15);
}
.roster-foot-note {
  font-family: var(--font-mono); font-size: 11px;
  letter-spacing: 0.04em;
  color: var(--cs-static-60);
  max-width: 58ch;
}
.roster-foot-cta {
  font-family: var(--font-mono); font-size: 11.5px; font-weight: 700;
  letter-spacing: 0.12em; text-transform: uppercase;
  background: var(--cs-static); color: var(--cs-notebook);
  border: 0; padding: 12px 18px;
  cursor: pointer;
  border-radius: 3px;
  transition: background .14s ease, transform .14s ease;
}
.roster-foot-cta:hover {
  background: var(--cs-recording);
  transform: translateY(-1px);
}

/* =========================================================
   TRANSFORM
   ========================================================= */
.transform { background: var(--cs-notebook); }
.transform-h2 {
  font-family: var(--font-display); font-size: clamp(34px, 4.5vw, 54px);
  font-weight: 600; line-height: 1.08; letter-spacing: -0.025em;
  margin: 16px auto 0; max-width: 820px;
}
.transform-grid {
  display: grid; grid-template-columns: 1fr auto 1fr; gap: 40px; align-items: stretch;
  max-width: 1080px; margin: 0 auto;
}
@media (max-width: 860px) {
  .transform-grid { grid-template-columns: 1fr; }
  .tf-arrow { display: none; }
}
.tf-col { padding: 20px; border: 1.5px solid var(--cs-static); background: var(--cs-notebook); }
.tf-before { border-style: dashed; }
.tf-after { border-style: solid; box-shadow: 6px 6px 0 var(--cs-ballpoint); }
.tf-label {
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.18em;
  text-transform: uppercase; font-weight: 700; color: var(--cs-static-60); margin-bottom: 16px;
}
.tf-label-after { color: var(--cs-ballpoint); }
.tf-col ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 12px; }
.tf-col li {
  font-size: 16px; line-height: 1.5; padding-left: 24px; position: relative;
}
.tf-before li { color: rgba(30,30,30,0.65); }
.tf-after li { color: var(--cs-static); font-weight: 500; }
.tf-x, .tf-check {
  position: absolute; left: 0; top: 0; font-family: var(--font-hand);
  font-size: 22px; line-height: 1;
}
.tf-x { color: var(--cs-recording); }
.tf-check { color: var(--cs-ballpoint); }
.tf-arrow { display: flex; align-items: center; justify-content: center; }
.tf-arrow-hand {
  font-family: var(--font-hand); font-size: 36px; color: var(--cs-ballpoint);
  transform: rotate(-8deg); text-align: center;
}

/* =========================================================
   FINAL CTA
   ========================================================= */
.final-cta {
  background: var(--cs-static); color: var(--cs-notebook);
  padding: 112px 0;
}
.finalcta-kicker {
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.2em;
  text-transform: uppercase; color: rgba(255,252,247,0.55); margin-bottom: 20px;
}
.finalcta-h2 {
  font-family: var(--font-display); font-size: clamp(40px, 5.4vw, 72px);
  font-weight: 600; line-height: 1.05; letter-spacing: -0.03em;
  margin: 0 0 24px; color: var(--cs-notebook);
}
.finalcta-em { color: var(--cs-cellotape); font-style: italic; font-weight: 400; }
.finalcta-p { font-size: 18px; line-height: 1.6; max-width: 600px; margin: 0 auto 36px; color: rgba(255,252,247,0.82); }
.finalcta-fine {
  margin-top: 18px; font-family: var(--font-mono); font-size: 10.5px;
  letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255,252,247,0.55);
}
.finalcta-sig {
  margin-top: 40px; font-family: var(--font-hand); font-size: 28px;
  color: var(--cs-cellotape); line-height: 1.15;
}

/* =========================================================
   FAQ
   ========================================================= */
.faq-section { background: var(--cs-notebook); }
.faq-h2 {
  font-family: var(--font-display); font-size: clamp(30px, 4vw, 46px);
  font-weight: 600; line-height: 1.1; letter-spacing: -0.025em; margin: 14px 0 0;
}
.faq-wrap { border: 2px solid var(--cs-static); background: var(--cs-notebook); }
.faq-item { border-top: 1.5px solid var(--cs-static); }
.faq-item:first-child { border-top: 0; }
.faq-q {
  width: 100%; padding: 18px 20px; background: transparent;
  border: 0; cursor: pointer; text-align: left;
  display: flex; align-items: center; gap: 14px;
  font-family: var(--font-display); font-size: 18px; font-weight: 600;
  letter-spacing: -0.01em; color: var(--cs-static);
  transition: background .2s, color .2s;
}
.faq-item.is-open .faq-q { background: var(--cs-static); color: var(--cs-notebook); }
.faq-q-num {
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.2em;
  color: var(--cs-recording); font-weight: 700; min-width: 36px;
}
.faq-q-text { flex: 1; }
.faq-q-toggle { font-family: var(--font-mono); font-size: 20px; }
.faq-a { padding: 6px 20px 22px 70px; font-size: 16px; line-height: 1.65; color: var(--cs-static); }

/* =========================================================
   FOOTER
   ========================================================= */
.footer { padding: 40px 0 56px; background: var(--cs-notebook); border-top: 1.5px solid rgba(30,30,30,0.15); }
.footer-inner { display: flex; gap: 24px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.footer-l { display: flex; align-items: center; gap: 18px; }
.footer-rule { width: 1px; height: 22px; background: rgba(30,30,30,0.2); }
.footer-r { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--cs-static-60); }

/* =========================================================
   TWEAKS PANEL
   ========================================================= */
.tweaks-panel {
  position: fixed; right: 20px; bottom: 20px; z-index: 200;
  width: 280px; background: var(--cs-notebook);
  border: 2px solid var(--cs-static); box-shadow: 6px 6px 0 var(--cs-static);
  font-family: var(--font-mono); font-size: 12px;
}
.tweaks-panel-header {
  padding: 10px 14px; background: var(--cs-static); color: var(--cs-notebook);
  text-transform: uppercase; letter-spacing: var(--tracking-caps); font-weight: 700;
  display: flex; justify-content: space-between; align-items: center;
}
.tweaks-panel-body { padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.tweaks-row { display: flex; flex-direction: column; gap: 6px; }
.tweaks-row label {
  font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700;
  color: var(--cs-static-60);
}
.tweaks-row .swatches { display: flex; gap: 6px; flex-wrap: wrap; }
.tweaks-row .swatch {
  width: 100%; padding: 8px; border: 1.5px solid var(--cs-static);
  cursor: pointer; font-size: 11px; text-transform: uppercase;
  letter-spacing: 0.08em; font-weight: 700; background: var(--cs-notebook);
  text-align: left; display: flex; align-items: center; gap: 8px;
}
.tweaks-row .swatch.active { background: var(--cs-static); color: var(--cs-notebook); }
.tweaks-row .swatch .chip { width: 14px; height: 14px; border: 1px solid var(--cs-static); flex-shrink: 0; }
.tweaks-panel-close { background: transparent; border: none; color: var(--cs-notebook); cursor: pointer; font-size: 16px; }


/* =========================================================
   DAYS V2 — deep section with alternating rich scenes per day
   ========================================================= */
.days-v2 {
  padding: 140px 0 100px;
  background: var(--cs-notebook);
  position: relative;
  overflow: hidden;
}
.days-v2::before {
  content: '';
  position: absolute; inset: 0;
  background-image:
    radial-gradient(circle at 12% 18%, rgba(44,95,230,0.05) 0, transparent 40%),
    radial-gradient(circle at 88% 78%, rgba(255,79,20,0.05) 0, transparent 42%);
  pointer-events: none;
}

.days-v2-head { text-align: center; max-width: 860px; margin: 0 auto 90px; position: relative; }
.days-v2-eyebrow {
  display: inline-flex; align-items: center; gap: 14px;
  font-family: var(--font-mono); font-size: 11px;
  letter-spacing: 0.22em; text-transform: uppercase; font-weight: 700;
  color: var(--cs-static-60); margin-bottom: 24px;
}
.dve-line { flex: 0 0 48px; height: 1px; background: var(--cs-static-40); }
.days-v2-h2 {
  font-family: var(--font-display);
  font-size: clamp(42px, 5.4vw, 72px);
  line-height: 1.05; letter-spacing: -0.02em; font-weight: 700;
  color: var(--cs-static); margin: 0 0 22px;
}
.days-v2-hand {
  font-family: var(--font-hand, 'Caveat', cursive);
  font-size: 0.82em; color: var(--cs-ballpoint); font-weight: 500;
  font-style: italic;
}
.days-v2-sub {
  font-size: 18px; line-height: 1.6; color: var(--cs-static-80);
  max-width: 680px; margin: 0 auto;
}
.days-v2-sub b { color: var(--cs-static); font-weight: 600; }

.day-rows { display: flex; flex-direction: column; gap: 140px; position: relative; }

.day-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 70px;
  align-items: center;
  position: relative;
  min-height: 640px;
}
.day-row-reverse .day-row-scene { order: 2; }
.day-row-reverse .day-row-body { order: 1; }

/* Huge ghosted day number */
.day-bignum {
  position: absolute;
  font-family: var(--font-display);
  font-size: 360px;
  font-weight: 800;
  line-height: 1;
  color: var(--day-accent, var(--cs-ballpoint));
  opacity: 0.06;
  letter-spacing: -0.04em;
  pointer-events: none;
  user-select: none;
  top: -40px;
  z-index: 0;
}
.day-row:not(.day-row-reverse) .day-bignum { right: -20px; }
.day-row-reverse .day-bignum { left: -20px; }

.day-row-scene { position: relative; z-index: 1; }
.day-row-body { position: relative; z-index: 1; }

/* Scene wrap */
.day-scene-wrap {
  position: relative;
  width: 100%;
  max-width: 560px;
  margin: 0 auto;
}
.day-scene-tag {
  position: absolute;
  bottom: -20px; left: 28px;
  background: var(--cs-static); color: var(--cs-notebook);
  padding: 8px 16px;
  display: inline-flex; align-items: center; gap: 12px;
  font-family: var(--font-mono); font-size: 10.5px;
  letter-spacing: 0.2em; text-transform: uppercase; font-weight: 700;
  z-index: 3;
  box-shadow: 3px 3px 0 var(--day-accent, var(--cs-ballpoint));
}
.dst-label { color: var(--day-accent, var(--cs-notebook)); }
.dst-time { color: var(--cs-notebook); opacity: 0.72; }

/* Generic scene frame */
.day-scene {
  position: relative;
  width: 100%;
  aspect-ratio: 4 / 3.2;
  border: 1.5px solid var(--cs-static);
  background: #FFFDF8;
  box-shadow: 8px 8px 0 var(--day-accent, var(--cs-ballpoint));
  overflow: hidden;
}

/* ---- Backgrounds ---- */
.scene-bg-grid {
  position: absolute; inset: 0;
  background-image:
    linear-gradient(var(--cs-static-15) 1px, transparent 1px),
    linear-gradient(90deg, var(--cs-static-15) 1px, transparent 1px);
  background-size: 28px 28px;
  opacity: 0.7;
}
.scene-bg-dots {
  position: absolute; inset: 0;
  background-image: radial-gradient(var(--cs-static-30) 1px, transparent 1px);
  background-size: 22px 22px;
}
.scene-bg-lined {
  position: absolute; inset: 0;
  background-image: repeating-linear-gradient(
    to bottom, transparent 0, transparent 30px,
    rgba(44,95,230,0.18) 30px, rgba(44,95,230,0.18) 31px
  );
}
.scene-bg-lined::before {
  content: '';
  position: absolute; left: 62px; top: 0; bottom: 0;
  width: 1px; background: rgba(255,79,20,0.45);
}

/* ---- Day 1 scene: notebook page with crossed-out old world + handwritten new ---- */
.scene-paper {
  position: absolute;
  inset: 38px 48px 52px 48px;
  background: #FFFCF3;
  border: 1px solid var(--cs-static-15);
  padding: 38px 36px;
  transform: rotate(-1.2deg);
  box-shadow: 2px 3px 0 rgba(0,0,0,0.04);
}
.scene-paper-tape {
  position: absolute;
  width: 78px; height: 20px;
  background: rgba(230,200,120,0.55);
  border-left: 1px dashed rgba(180,150,80,0.4);
  border-right: 1px dashed rgba(180,150,80,0.4);
  top: -10px;
}
.scene-paper-tape-l { left: 20px; transform: rotate(-6deg); }
.scene-paper-tape-r { right: 20px; transform: rotate(5deg); }

.scene-paper-rule {
  height: 1px; background: var(--cs-static-15);
  margin: 12px 0;
}
.scene-paper-title, .scene-paper-sub {
  font-family: var(--font-display);
  color: var(--cs-static);
  font-size: 22px; font-weight: 600;
  line-height: 1.3;
}
.scene-paper-title { margin-top: 8px; }
.scene-paper-sub { font-size: 17px; font-weight: 500; color: var(--cs-static-80); margin-top: 4px; }
.scene-strike { position: relative; }
.scene-strike::after {
  content: ''; position: absolute;
  left: -4%; right: -4%; top: 52%;
  height: 2px; background: var(--cs-recording);
  transform: rotate(-1.5deg);
  box-shadow: 0 1px 0 rgba(255,79,20,0.3);
}

.scene-arrow-big {
  position: absolute;
  left: 38%; top: 42%;
  width: 80px; height: 100px;
  color: var(--cs-ballpoint);
  opacity: 0.9;
}
.scene-paper-new {
  position: absolute;
  bottom: 26px; right: 30px;
  text-align: right;
  max-width: 60%;
}
.scene-hand-big {
  font-family: var(--font-hand, 'Caveat', cursive);
  font-size: 40px; font-weight: 600;
  color: var(--cs-ballpoint);
  line-height: 1;
  display: block;
}
.scene-annotation {
  font-family: var(--font-hand, 'Caveat', cursive);
  font-size: 20px; color: var(--cs-static-60);
  margin-top: 6px;
}

.scene-sticker {
  position: absolute;
  right: -14px; top: 20px;
  background: var(--cs-static); color: var(--cs-notebook);
  padding: 10px 14px;
  transform: rotate(6deg);
  z-index: 4;
  box-shadow: -2px 2px 0 rgba(0,0,0,0.2);
}
.ssk-text {
  font-family: var(--font-mono); font-size: 10px;
  letter-spacing: 0.2em; font-weight: 700;
  color: var(--cs-recording); display: inline-flex; align-items: center; gap: 4px;
}
.ssk-text::before {
  content: ''; width: 6px; height: 6px; border-radius: 50%;
  background: var(--cs-recording); animation: pulse 1.6s ease infinite;
}
.ssk-sub {
  font-family: var(--font-mono); font-size: 14px; font-weight: 700;
  margin-top: 2px; letter-spacing: 0.08em;
}

.scene-coffee {
  position: absolute;
  left: 14px; bottom: 14px;
  width: 56px; height: 56px;
  border: 2px solid rgba(120,70,20,0.28);
  border-radius: 50%;
  background: radial-gradient(circle at center, transparent 58%, rgba(120,70,20,0.12) 72%);
}
.scene-coffee::after {
  content: '';
  position: absolute; inset: 6px;
  border: 1px solid rgba(120,70,20,0.2);
  border-radius: 50%;
}

/* ---- Day 2 scene: two polaroids + connector + cassette ---- */
.scene-poly {
  position: absolute;
  background: #FFFEFA;
  border: 1px solid var(--cs-static-15);
  padding: 10px 10px 38px;
  width: 160px;
  box-shadow: 3px 4px 0 rgba(0,0,0,0.08);
}
.scene-poly-jay { left: 8%; top: 18%; transform: rotate(-7deg); }
.scene-poly-chad { right: 8%; top: 30%; transform: rotate(6deg); }
.scene-poly-img {
  width: 100%; aspect-ratio: 1 / 1;
  background-size: cover; background-position: center;
  background-color: var(--cs-static-15);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-display); font-size: 42px; font-weight: 700;
  color: var(--cs-static-60);
}
.scene-poly-img-jay { background-image: url('photos/jay-clouse-avatar.jpg'); }
.scene-poly-img-chad {
  background: linear-gradient(135deg, #8BA3D9, #4F6FB8);
  color: #fff;
}
.scene-poly-cap {
  text-align: center; padding-top: 12px;
  font-family: var(--font-hand, 'Caveat', cursive);
  font-size: 18px; color: var(--cs-static-80);
}
.scene-poly-tape {
  position: absolute; top: -10px; left: 40%;
  width: 52px; height: 18px;
  background: rgba(230,200,120,0.55);
  transform: rotate(-4deg);
}
.scene-poly-tape-alt { background: rgba(180,205,255,0.55); transform: rotate(6deg); }

.scene-ampersand {
  position: absolute;
  left: 50%; top: 50%;
  transform: translate(-50%, -70%);
  font-family: var(--font-display);
  font-size: 72px; font-weight: 700;
  color: var(--cs-recording);
  line-height: 1;
}

.scene-connector {
  position: absolute;
  left: 50%; top: 42%;
  width: 240px;
  transform: translate(-50%, 0);
  color: var(--cs-ballpoint);
}
.scene-connector svg { width: 100%; display: block; }
.scene-connector-label {
  display: block; text-align: center;
  font-family: var(--font-mono); font-size: 10px;
  letter-spacing: 0.2em; text-transform: uppercase; font-weight: 700;
  color: var(--cs-ballpoint); margin-top: 2px;
}

.scene-stamp {
  position: absolute;
  border: 3px solid var(--cs-recording); color: var(--cs-recording);
  padding: 8px 14px;
  font-family: var(--font-mono); font-weight: 800; letter-spacing: 0.25em;
  font-size: 14px; text-transform: uppercase;
  transform: rotate(-8deg);
  opacity: 0.85;
}
.scene-stamp-2 { right: 22px; bottom: 18px; transform: rotate(7deg); }
.scene-stamp-3 {
  left: 24px; top: 22px; transform: rotate(-12deg);
  border-color: var(--cs-ballpoint); color: var(--cs-ballpoint);
}

.scene-cassette {
  position: absolute;
  left: 20px; bottom: 20px;
  width: 120px; height: 56px;
  background: var(--cs-static); color: var(--cs-notebook);
  display: flex; align-items: center; justify-content: space-around;
  padding: 0 14px; position: relative;
  box-shadow: 2px 2px 0 rgba(0,0,0,0.15);
}
.sc-reel {
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--cs-notebook);
  position: relative;
}
.sc-reel::after {
  content: ''; position: absolute; inset: 6px;
  border-radius: 50%; background: var(--cs-static);
}
.sc-label {
  position: absolute; bottom: -18px; left: 0; right: 0;
  font-family: var(--font-mono); font-size: 8.5px;
  letter-spacing: 0.18em; text-align: center;
  color: var(--cs-static-60);
}

/* ---- Day 3 scene: stacked question cards ---- */
.scene-qcard {
  position: absolute;
  background: #FFFEFA;
  border: 1px solid var(--cs-static-15);
  padding: 14px 16px 12px;
  width: 52%;
  box-shadow: 2px 3px 0 rgba(0,0,0,0.06);
}
.scene-qcard-0 { top: 10%; left: 8%; }
.scene-qcard-1 { top: 22%; right: 10%; }
.scene-qcard-2 { top: 40%; left: 14%; }
.scene-qcard-3 { top: 54%; right: 8%; }
.scene-qcard-4 { top: 68%; left: 10%; }

.scene-qcard-top { display: flex; gap: 4px; margin-bottom: 8px; }
.sqc-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--cs-static-30);
}
.scene-qcard-text {
  font-family: var(--font-display);
  font-size: 17px; font-weight: 500;
  color: var(--cs-static);
}
.scene-qcard-meta {
  font-family: var(--font-mono); font-size: 9.5px;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--cs-static-60);
  margin-top: 6px;
}

.scene-mic {
  position: absolute;
  right: 18px; bottom: 14px;
  width: 48px; height: 80px;
  color: var(--cs-ballpoint);
  opacity: 0.85;
  transform: rotate(8deg);
}

/* =========================================================
   DAY ROW BODY — typographic + annotations
   ========================================================= */
.day-kicker {
  display: flex; align-items: center; gap: 12px;
  font-family: var(--font-mono); font-size: 11px;
  letter-spacing: 0.22em; text-transform: uppercase; font-weight: 700;
  color: var(--day-accent, var(--cs-ballpoint));
  margin-bottom: 18px;
}
.day-kicker-line {
  display: block; width: 40px; height: 2px;
  background: var(--day-accent, var(--cs-ballpoint));
}
.day-row-title {
  font-family: var(--font-display);
  font-size: clamp(32px, 3.4vw, 46px);
  line-height: 1.08; letter-spacing: -0.015em; font-weight: 700;
  color: var(--cs-static);
  margin: 0 0 12px;
}
.day-row-hand {
  font-family: var(--font-hand, 'Caveat', cursive);
  font-size: 22px; color: var(--day-accent, var(--cs-ballpoint));
  font-style: italic; margin: 0 0 18px;
}
.day-row-lede {
  font-size: 17px; line-height: 1.65;
  color: var(--cs-static-80);
  margin: 0 0 30px;
  max-width: 560px;
}

.day-row-topics {
  background: var(--cs-paper, #F6EEDD);
  border: 1px solid var(--cs-static-15);
  padding: 22px 24px;
  margin-bottom: 28px;
  position: relative;
}
.day-row-topics::before {
  content: ''; position: absolute;
  top: -8px; left: 20px;
  width: 60px; height: 14px;
  background: rgba(230,200,120,0.6);
  transform: rotate(-3deg);
}
.drt-head {
  display: flex; align-items: center; gap: 8px;
  font-family: var(--font-mono); font-size: 10.5px;
  letter-spacing: 0.2em; text-transform: uppercase; font-weight: 700;
  color: var(--cs-static-60);
  margin-bottom: 14px;
}
.drt-checkmark {
  width: 18px; height: 18px;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--day-accent, var(--cs-ballpoint));
  color: var(--cs-notebook);
  font-size: 11px; font-weight: 800;
}
.day-row-topics ul {
  list-style: none; padding: 0; margin: 0;
  display: flex; flex-direction: column; gap: 10px;
}
.day-row-topics li {
  font-size: 15.5px; line-height: 1.5;
  color: var(--cs-static);
  padding-left: 22px; position: relative;
}
.day-row-topics li::before {
  content: '→'; position: absolute;
  left: 0; top: 0;
  color: var(--day-accent, var(--cs-ballpoint));
  font-weight: 700;
}

.day-row-quote {
  border-left: 3px solid var(--day-accent, var(--cs-ballpoint));
  padding: 4px 0 4px 24px;
  margin: 0 0 28px;
  position: relative;
}
.drq-mark {
  position: absolute;
  left: 16px; top: -20px;
  font-family: var(--font-display);
  font-size: 64px; font-weight: 700;
  color: var(--day-accent, var(--cs-ballpoint));
  line-height: 1;
  opacity: 0.35;
}
.day-row-quote p {
  font-family: var(--font-display);
  font-size: 20px; font-weight: 500;
  line-height: 1.4; color: var(--cs-static);
  margin: 0 0 8px;
  font-style: italic;
}
.day-row-quote footer {
  font-family: var(--font-mono); font-size: 11px;
  letter-spacing: 0.15em; text-transform: uppercase;
  color: var(--cs-static-60); font-weight: 600;
}

.day-row-reveal {
  background: var(--cs-static);
  color: var(--cs-notebook);
  padding: 18px 22px;
  margin-bottom: 22px;
  position: relative;
}
.day-row-reveal::before {
  content: '★'; position: absolute;
  top: -12px; right: 16px;
  width: 28px; height: 28px;
  background: var(--cs-recording);
  display: flex; align-items: center; justify-content: center;
  color: var(--cs-notebook); font-size: 14px; font-weight: 700;
  transform: rotate(12deg);
}
.drr-label {
  display: block;
  font-family: var(--font-mono); font-size: 10px;
  letter-spacing: 0.24em; text-transform: uppercase; font-weight: 800;
  color: var(--cs-recording); margin-bottom: 6px;
}
.day-row-reveal p {
  font-size: 15px; line-height: 1.55;
  margin: 0; color: var(--cs-notebook); opacity: 0.92;
}

.day-row-walkaway {
  border-top: 2px dotted var(--cs-static-30);
  border-bottom: 2px dotted var(--cs-static-30);
  padding: 16px 0;
  margin-bottom: 22px;
}
.drw-label {
  display: block;
  font-family: var(--font-mono); font-size: 10px;
  letter-spacing: 0.22em; text-transform: uppercase; font-weight: 700;
  color: var(--cs-static-60); margin-bottom: 6px;
}
.day-row-walkaway p {
  font-size: 16px; line-height: 1.55;
  color: var(--cs-static); font-weight: 500;
  margin: 0;
}

.day-row-fear {
  margin-bottom: 24px;
}
.drf-label {
  display: block;
  font-family: var(--font-hand, 'Caveat', cursive);
  font-size: 18px; color: var(--cs-recording);
  font-style: italic;
  margin-bottom: 4px;
}
.day-row-fear p {
  font-family: var(--font-display);
  font-size: 17px; font-style: italic;
  color: var(--cs-static-60); margin: 0;
  line-height: 1.4;
}

.day-row-cta {
  display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
}
.drc-fine {
  font-family: var(--font-mono); font-size: 10.5px;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--cs-static-60);
}

@media (max-width: 900px) {
  .day-row { grid-template-columns: 1fr; gap: 40px; min-height: auto; }
  .day-row-reverse .day-row-scene { order: 1; }
  .day-row-reverse .day-row-body { order: 2; }
  .day-bignum { font-size: 200px; top: -20px; right: -10px; left: auto !important; }
  .day-rows { gap: 90px; }
}


/* =========================================================
   BRAND GRAPHICS — doodles, notebook, post-it, stamps
   ========================================================= */

/* Sketch underline — wrapper .underlined positions SVG below */
.sketch-underline {
  position: absolute; left: -4%; right: -4%; bottom: -8px;
  width: 108%; height: 14px; pointer-events: none; z-index: 0;
}
.underlined { position: relative; display: inline-block; }
.underlined > * { position: relative; z-index: 1; }

/* Circle scribble around text */
.circle-scribble {
  position: absolute; inset: -18% -10%; width: 120%; height: 136%;
  pointer-events: none; z-index: 0;
}
.circled-word { position: relative; display: inline-block; padding: 2px 8px; }
.circled-word > * { position: relative; z-index: 1; }

/* Numbered stamp (01/02/03) */
.num-stamp {
  position: relative; display: inline-flex;
  width: 80px; height: 80px; align-items: center; justify-content: center;
}
.num-stamp svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.num-stamp-text {
  font-family: var(--font-display); font-size: 32px; font-weight: 700;
  color: var(--c); letter-spacing: -0.02em; line-height: 1;
}

/* Ruled notebook-page background */
.ruled-page {
  position: relative; background: var(--cs-notebook);
  background-image:
    repeating-linear-gradient(
      to bottom,
      transparent 0,
      transparent 35px,
      rgba(30,30,30,0.08) 35px,
      rgba(30,30,30,0.08) 36px
    );
  border: 1.5px solid rgba(30,30,30,0.15);
  padding: 44px 48px 44px 72px;
}
.ruled-page::before {
  content: '';
  position: absolute; top: 0; bottom: 0; left: 48px; width: 1px;
  background: rgba(198,48,48,0.35);
}
.ruled-page::after {
  content: '';
  position: absolute; top: 30px; bottom: 30px; left: 20px; width: 10px;
  background-image: radial-gradient(circle, rgba(30,30,30,0.2) 4px, transparent 4.5px);
  background-size: 10px 33%;
  background-repeat: repeat-y;
}

/* Post-it note */
.postit {
  position: relative; padding: 20px 22px 22px;
  box-shadow: 2px 6px 14px rgba(30,30,30,0.14), 0 1px 2px rgba(30,30,30,0.08);
  font-family: var(--font-hand); font-size: 18px;
  line-height: 1.45; color: var(--cs-static);
}
.postit::before {
  content: ''; position: absolute; top: -6px; left: 50%;
  width: 60px; height: 16px; transform: translateX(-50%) rotate(-2deg);
  background: var(--cs-cellotape); opacity: 0.85;
  box-shadow: 0 1px 2px rgba(30,30,30,0.1);
}

/* Margin note (handwritten annotation) */
.margin-note {
  font-family: var(--font-hand); font-size: 19px;
  display: inline-block; line-height: 1.3; letter-spacing: -0.005em;
}

/* Torn edge */
.torn-edge { position: absolute; left: 0; right: 0; width: 100%; height: 12px; pointer-events: none; }
.torn-edge-top { top: -11px; }
.torn-edge-bottom { bottom: -11px; transform: scaleY(-1); }

/* Tape strip helper */
.tape-strip { border-radius: 1px; box-shadow: 0 1px 2px rgba(30,30,30,0.08); }


/* =========================================================
   PREMIUM ANIMATIONS — brand graphics
   ========================================================= */

@media (prefers-reduced-motion: reduce) {
  .draw-path, .doodle-sparkle, .doodle-star, .illus-stamp.stamp-drop,
  .illus-cassette .cassette-reel, .postit.postit-bob,
  .num-stamp, .num-stamp-ring {
    animation: none !important;
    transition: none !important;
    stroke-dashoffset: 0 !important;
    opacity: 1 !important;
    transform: none !important;
  }
}

/* Draw-in path (universal) — organic ink stroke that draws in */
.draw-path {
  stroke-dasharray: 500;
  stroke-dashoffset: 500;
  transition: stroke-dashoffset 1200ms cubic-bezier(.33, .05, .25, 1);
}
.draw-path.is-in {
  stroke-dashoffset: 0;
}

/* Sparkle — pop in + idle pulse */
.doodle-sparkle {
  transform: scale(0) rotate(-60deg);
  opacity: 0;
  transition: transform 500ms cubic-bezier(.34, 1.56, .64, 1), opacity 300ms ease-out;
}
.doodle-sparkle.is-in {
  transform: scale(1) rotate(0deg);
  opacity: 1;
  animation: sparkle-pulse 3.6s ease-in-out 800ms infinite;
}
@keyframes sparkle-pulse {
  0%, 100% { transform: scale(1) rotate(0deg); }
  40%      { transform: scale(1.16) rotate(22deg); }
  65%      { transform: scale(0.94) rotate(-8deg); }
}

/* Star — fade + slight rotate-in */
.doodle-star {
  opacity: 0;
  transform-origin: center;
  transition: opacity 500ms ease-out 200ms;
}
.doodle-star.is-in {
  opacity: 1;
}

/* Stamp drop — whoosh in with settle wobble */
.illus-stamp.stamp-drop {
  opacity: 0;
  transform: scale(1.8) rotate(calc(var(--rot) - 18deg));
  transition: opacity 180ms ease-out, transform 520ms cubic-bezier(.34, 1.56, .64, 1);
}
.illus-stamp.stamp-drop.is-in {
  opacity: 1;
  transform: scale(1) rotate(var(--rot));
  animation: stamp-settle 1.4s cubic-bezier(.22,.61,.36,1) 520ms 1;
}
@keyframes stamp-settle {
  0%   { transform: scale(1) rotate(var(--rot)); }
  22%  { transform: scale(1.03) rotate(calc(var(--rot) + 2deg)); }
  48%  { transform: scale(0.98) rotate(calc(var(--rot) - 1deg)); }
  100% { transform: scale(1) rotate(var(--rot)); }
}

/* Number stamp — drop in with dashed-ring counter-rotation */
.num-stamp {
  opacity: 0;
  transform: scale(0.6) rotate(-12deg);
  transition: opacity 300ms ease-out, transform 650ms cubic-bezier(.34, 1.56, .64, 1);
}
.num-stamp.is-in {
  opacity: 1;
  transform: scale(1) rotate(0deg);
}
.num-stamp.is-in .num-stamp-ring {
  transform-origin: 40px 40px;
  animation: ring-spin 36s linear infinite;
}
@keyframes ring-spin {
  to { transform: rotate(360deg); }
}

/* Cassette reels — continuous rotation (subtle, slow) */
.illus-cassette.is-spin .cassette-reel-l {
  animation: reel-spin 4.2s linear infinite;
}
.illus-cassette.is-spin .cassette-reel-r {
  animation: reel-spin 4.2s linear infinite;
  animation-delay: -0.7s;
}
@keyframes reel-spin {
  to { transform: rotate(360deg); }
}

/* Post-it idle bob */
.postit.postit-bob {
  transform: rotate(var(--rot, -2deg));
  animation: postit-bob 7s ease-in-out infinite;
  animation-delay: 0.4s;
}
@keyframes postit-bob {
  0%, 100% { transform: rotate(var(--rot, -2deg)) translateY(0); }
  50%      { transform: rotate(calc(var(--rot, -2deg) + 0.6deg)) translateY(-3px); }
}

/* Polaroid hover tilt */
.illus-polaroid {
  transition: transform 380ms cubic-bezier(.22, 1, .36, 1), box-shadow 380ms ease;
}
.illus-polaroid:hover {
  transform: rotate(0deg) scale(1.025) !important;
  box-shadow: 8px 14px 32px rgba(30,30,30,0.18), 0 2px 4px rgba(30,30,30,0.08);
  z-index: 10;
}

/* Tape strip hover flutter */
.tape-strip {
  transition: transform 240ms cubic-bezier(.22, 1, .36, 1);
}
.tape-strip:hover {
  transform: rotate(0deg) scaleX(1.04) !important;
}

/* Margin-note: gentle sway */
.margin-note {
  animation: note-sway 8s ease-in-out infinite;
  display: inline-block;
}
@keyframes note-sway {
  0%, 100% { transform: rotate(var(--rot, -3deg)); }
  50%      { transform: rotate(calc(var(--rot, -3deg) - 1deg)); }
}

/* Arrow doodle subtle bob */
.doodle-arrow-bob {
  animation: arrow-bob 4.2s ease-in-out infinite;
}
@keyframes arrow-bob {
  0%, 100% { transform: translate(0, 0); }
  50%      { transform: translate(2px, 3px); }
}

/* Circled word — wobble on hover */
.circled-word:hover .circle-scribble path {
  animation: wobble-trace 1.6s ease-in-out infinite;
}
@keyframes wobble-trace {
  0%, 100% { stroke-dashoffset: 0; }
  50%      { stroke-dashoffset: -4; }
}



/* =========================================================
   HERO SIGNATURE MARK — single confident brand graphic (top-right)
   ========================================================= */

.hero-sig-halo {

}

.hero-sig-ring {

  width: 100%; height: 100%;
  color: var(--cs-recording);

}
.hero-sig-ring-inner {
  animation: sig-ring-spin 34s linear infinite reverse;
}
@keyframes sig-ring-spin { to { transform: rotate(360deg); } }

.hero-sig-type {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  animation: sig-type-spin 64s linear infinite;
}
@keyframes sig-type-spin { to { transform: rotate(360deg); } }

.hero-sig-center {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%) rotate(-4deg);
  filter: drop-shadow(4px 6px 14px rgba(30,30,30,0.16));
  animation: sig-bob 6s ease-in-out infinite;
}
@keyframes sig-bob {
  0%, 100% { transform: translate(-50%, -50%) rotate(-4deg); }
  50%      { transform: translate(-50%, -54%) rotate(-2deg); }
}

.hero-sig-stamp {
  position: absolute;
  top: -4px; left: 26%;
  width: 110px; height: 110px;
  color: var(--cs-recording);
  transform: rotate(-14deg);

}
@keyframes sig-stamp-bob {

  50%      { transform: rotate(-12deg) translateY(-4px); }
}
.hero-sig-stamp svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.hero-sig-stamp-text {

  gap: 2px;

}

@media (max-width: 1100px) {
  .hero-mark-signature {
    top: 40px; left: -120px;
    width: 320px; height: 320px;
    opacity: 0.5;
  }
}
@media (max-width: 720px) {
  .hero-mark-signature { display: none; }
}

/* =========================================================
   TRANSFORMATION GRAPHICS — before & after
   ========================================================= */
.tfg {
  position: relative;
  width: 100%;
  aspect-ratio: 320 / 180;
  margin-bottom: 20px;
  overflow: hidden;
}
.tfg-paper { position: absolute; inset: 0; width: 100%; height: 100%; }
.tfg-chart { position: absolute; inset: 0; width: 100%; height: 100%; }
.tfg-label {
  position: absolute; top: 10px; left: 14px;
  font-family: var(--font-mono); font-size: 10px; font-weight: 700;
  letter-spacing: 0.14em; color: var(--cs-static-60);
  text-transform: uppercase;
  z-index: 3;
}
.tfg-label-after { color: var(--cs-ballpoint); }

/* ----- BEFORE: drooping chart, question marks, tangle ----- */
.tfg-before .tfg-chart-line {
  stroke-dasharray: 600;
  stroke-dashoffset: 600;
  transition: stroke-dashoffset 1600ms cubic-bezier(.5,.02,.5,1);
}
.tfg-before.is-in .tfg-chart-line { stroke-dashoffset: 0; }

.tfg-before .tfg-chart-dot {
  opacity: 0;
  transition: opacity 200ms ease-out;
}
.tfg-before.is-in .tfg-dot-1 { transition-delay: 400ms; opacity: 1; }
.tfg-before.is-in .tfg-dot-2 { transition-delay: 800ms; opacity: 1; }
.tfg-before.is-in .tfg-dot-3 {
  transition-delay: 1400ms; opacity: 1;
  animation: dot-drop 0.6s ease-in 1400ms both;
}
@keyframes dot-drop {
  0%   { transform: translateY(-60px); }
  70%  { transform: translateY(4px); }
  100% { transform: translateY(0); }
}

.tfg-float {
  position: absolute;
  font-family: var(--font-display); font-weight: 700;
  color: var(--cs-recording); opacity: 0;
  font-size: 24px;
  z-index: 2;
}
.tfg-before.is-in .tfg-q {
  animation: q-float 4.5s ease-in-out infinite;
}
.tfg-before.is-in .tfg-q-1 { top: 30%; left: 18%; animation-delay: 1.2s; }
.tfg-before.is-in .tfg-q-2 { top: 44%; left: 36%; font-size: 18px; animation-delay: 2.0s; }
.tfg-before.is-in .tfg-q-3 { top: 22%; left: 58%; font-size: 28px; animation-delay: 2.8s; }
@keyframes q-float {
  0%   { opacity: 0; transform: translateY(8px) rotate(-8deg); }
  20%  { opacity: 0.9; }
  80%  { opacity: 0.9; }
  100% { opacity: 0; transform: translateY(-22px) rotate(8deg); }
}

.tfg-scratch {
  position: absolute;
  z-index: 2;
  opacity: 0;
}
.tfg-scratch path {
  stroke-dasharray: 200;
  stroke-dashoffset: 200;
  transition: stroke-dashoffset 900ms ease-out;
}
.tfg-before.is-in .tfg-scratch { opacity: 1; transition: opacity 200ms ease-out; }
.tfg-before.is-in .tfg-scratch path { stroke-dashoffset: 0; }
.tfg-before.is-in .tfg-scratch-1 { top: 70%; left: 20%; width: 80px; height: 24px; transition-delay: 800ms; }
.tfg-before.is-in .tfg-scratch-1 path { transition-delay: 800ms; }
.tfg-before.is-in .tfg-scratch-2 { top: 56%; left: 54%; width: 60px; height: 20px; transform: rotate(4deg); transition-delay: 1200ms; }
.tfg-before.is-in .tfg-scratch-2 path { transition-delay: 1200ms; }

.tfg-tangle {
  position: absolute;
  top: 20%; right: 8%;
  width: 56px; height: 56px;
  z-index: 2;
  opacity: 0;
  animation-fill-mode: forwards;
}
.tfg-tangle path {
  stroke-dasharray: 300;
  stroke-dashoffset: 300;
}
.tfg-before.is-in .tfg-tangle {
  opacity: 1;
  transition: opacity 300ms ease-out 300ms;
  animation: tangle-wobble 6s ease-in-out infinite 1500ms;
}
.tfg-before.is-in .tfg-tangle path {
  animation: tangle-draw 2000ms ease-out 300ms forwards;
}
@keyframes tangle-draw { to { stroke-dashoffset: 0; } }
@keyframes tangle-wobble {
  0%, 100% { transform: rotate(0deg); }
  50%      { transform: rotate(10deg); }
}

/* ----- AFTER: rising bars, growth line, price tag, check seal ----- */
.tfg-after .tfg-bar {
  transform-box: fill-box;
  transform-origin: center bottom;
  transform: scaleY(0.01);
  transition: transform 700ms cubic-bezier(.34, 1.3, .64, 1);
}
.tfg-after.is-in .tfg-bar-1 { transform: scaleY(1); transition-delay: 200ms; }
.tfg-after.is-in .tfg-bar-2 { transform: scaleY(1); transition-delay: 400ms; }
.tfg-after.is-in .tfg-bar-3 { transform: scaleY(1); transition-delay: 600ms; }
.tfg-after.is-in .tfg-bar-4 { transform: scaleY(1); transition-delay: 800ms; }
.tfg-after.is-in .tfg-bar-5 { transform: scaleY(1); transition-delay: 1000ms; }

.tfg-after .tfg-chart-line-up {
  stroke-dasharray: 500;
  stroke-dashoffset: 500;
  transition: stroke-dashoffset 1800ms cubic-bezier(.3, .1, .3, 1) 300ms;
}
.tfg-after.is-in .tfg-chart-line-up { stroke-dashoffset: 0; }

.tfg-after .tfg-chart-arrow {
  stroke-dasharray: 40;
  stroke-dashoffset: 40;
  transition: stroke-dashoffset 280ms ease-out 2100ms;
}
.tfg-after.is-in .tfg-chart-arrow { stroke-dashoffset: 0; }

.tfg-price {
  position: absolute;
  top: 14%; right: 6%;
  width: 108px; height: 48px;
  z-index: 3;
  transform: rotate(-8deg) translateY(-80px);
  opacity: 0;
  transition: transform 700ms cubic-bezier(.34, 1.56, .64, 1) 1400ms,
              opacity 300ms ease-out 1400ms;
  filter: drop-shadow(2px 4px 6px rgba(30,30,30,0.18));
}
.tfg-after.is-in .tfg-price {
  transform: rotate(-8deg) translateY(0);
  opacity: 1;
}
.tfg-after.is-in .tfg-price {
  animation: price-sway 5s ease-in-out infinite 2s;
}
@keyframes price-sway {
  0%, 100% { transform: rotate(-8deg) translateY(0); }
  50%      { transform: rotate(-6deg) translateY(-2px); }
}
.tfg-price svg { width: 100%; height: 100%; display: block; }
.tfg-price-text {
  position: absolute; top: 50%; left: 52%;
  transform: translate(-50%, -50%);
  font-family: var(--font-display); font-weight: 700; font-size: 22px;
  color: var(--cs-notebook); letter-spacing: -0.02em; line-height: 1;
}
.tfg-price-text span {
  display: block; font-size: 10px; letter-spacing: 0.1em; font-weight: 500;
  margin-top: 2px; opacity: 0.85;
}

.tfg-dollar {
  position: absolute;
  font-family: var(--font-display); font-weight: 700;
  color: var(--cs-ballpoint);
  font-size: 20px;
  opacity: 0;
  pointer-events: none;
  z-index: 2;
}
.tfg-after.is-in .tfg-dollar {
  animation: dollar-rise 3.8s ease-out infinite;
}
.tfg-after.is-in .tfg-d-1 { bottom: 18%; left: 10%; font-size: 16px; animation-delay: 1.6s; }
.tfg-after.is-in .tfg-d-2 { bottom: 28%; left: 34%; font-size: 22px; animation-delay: 2.4s; }
.tfg-after.is-in .tfg-d-3 { bottom: 20%; left: 58%; font-size: 18px; animation-delay: 3.2s; }
@keyframes dollar-rise {
  0%   { opacity: 0; transform: translateY(0) scale(0.8); }
  20%  { opacity: 1; }
  80%  { opacity: 0.7; }
  100% { opacity: 0; transform: translateY(-50px) scale(1.1); }
}

.tfg-seal {
  position: absolute;
  bottom: 14%; right: 10%;
  width: 72px; height: 72px;
  z-index: 3;
  opacity: 0;
  transform: scale(1.8) rotate(-18deg);
  transition: opacity 200ms ease-out 1800ms,
              transform 500ms cubic-bezier(.34, 1.8, .64, 1) 1800ms;
}
.tfg-after.is-in .tfg-seal {
  opacity: 1;
  transform: scale(1) rotate(-8deg);
}
.tfg-seal svg { width: 100%; height: 100%; display: block; }
.tfg-seal-check {
  stroke-dasharray: 80;
  stroke-dashoffset: 80;
  transition: stroke-dashoffset 500ms ease-out 2200ms;
}
.tfg-after.is-in .tfg-seal-check { stroke-dashoffset: 0; }

.tfg-spark {
  position: absolute;
  font-family: var(--font-display);
  font-size: 16px;
  color: var(--cs-recording);
  opacity: 0;
  z-index: 2;
}
.tfg-after.is-in .tfg-spark {
  animation: spark-pulse 2.4s ease-in-out infinite;
}
.tfg-after.is-in .tfg-sp-1 { top: 18%; left: 42%; animation-delay: 2.2s; }
.tfg-after.is-in .tfg-sp-2 { bottom: 30%; right: 38%; font-size: 20px; animation-delay: 2.8s; }
@keyframes spark-pulse {
  0%, 100% { opacity: 0; transform: scale(0.5); }
  50%      { opacity: 1; transform: scale(1); }
}

@media (prefers-reduced-motion: reduce) {
  .tfg *, .hero-mark-signature * {
    animation: none !important;
    transition: none !important;
    stroke-dashoffset: 0 !important;
    opacity: 1 !important;
    transform: none !important;
  }
}
