  font-family: var(--font-hand); font-size: 22px;
  color: var(--cs-static); transform: rotate(-1deg);
}

.rg-textjay-step-num {
  display: inline-flex; align-items: center; gap: 10px;
  margin-bottom: 16px;
}
.rg-textjay-step-num .num {
  width: 38px; height: 38px;
  background: var(--cs-ballpoint); color: var(--cs-notebook);
  border: 1.5px solid var(--cs-static);
  display: inline-flex; align-items: center; justify-content: center;
  font-family: var(--font-display); font-weight: 700; font-size: 18px;
  box-shadow: 3px 3px 0 var(--cs-static);
}
.rg-textjay-step-num .lbl {
  font-family: var(--font-mono); font-size: 11px;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--cs-ballpoint); font-weight: 700;
  display: inline-flex; align-items: center; gap: 8px;
}
.rg-textjay-step-num .pulse-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--cs-ballpoint); animation: pulse 1.5s infinite;
}

.rg-textjay-script {
  font-family: var(--font-hand);
  font-size: clamp(28px, 3vw, 38px);
  color: var(--cs-ballpoint);
  line-height: 1; margin-bottom: 6px;
  transform: rotate(-1.6deg);
  display: inline-block;
}
.rg-textjay-script .arrow { display: inline-block; animation: rgnudge 1.2s ease-in-out infinite; }
@keyframes rgnudge { 0%,100%{transform:translateX(0)} 50%{transform:translateX(8px)} }

.rg-textjay-h2 {
  font-family: var(--font-display);
  font-size: clamp(30px, 4vw, 46px);
  font-weight: 600; line-height: 1.06;
  letter-spacing: -0.02em;
  color: var(--cs-static);
  margin: 6px 0 16px;
}
.rg-textjay-h2 em {
  font-family: var(--font-serif); font-style: italic;
  color: var(--cs-ballpoint);
}
.rg-textjay-body p {
  font-family: var(--font-serif); font-size: 17px;
  line-height: 1.6; color: var(--cs-static);
  margin: 0 0 16px; max-width: 480px;
}
.rg-textjay-body b { font-family: var(--font-display); font-weight: 700; }

/* [REMOVED] .rg-sms-mock-* — the old "to: Jay · Three Days With Jay / VIP"
   blue iMessage bubble mockup used inside the now-deleted RgPrep Step 01
   SMS opt-in. No longer referenced anywhere. */

.rg-textjay-cta {
  display: inline-flex; align-items: center; gap: 12px;
  padding: 18px 28px;
  background: var(--cs-ballpoint); color: var(--cs-notebook);
  font-family: var(--font-mono); font-weight: 700;
  font-size: 13px; letter-spacing: 0.18em;
  text-transform: uppercase; text-decoration: none;
  border: 2px solid var(--cs-static);
  box-shadow: 6px 6px 0 var(--cs-static);
  transition: transform .12s, box-shadow .12s;
  cursor: pointer;
}
.rg-textjay-cta:hover {
  transform: translate(-2px,-2px);
  box-shadow: 8px 8px 0 var(--cs-static);
}
.rg-textjay-cta:active {
  transform: translate(2px,2px);
  box-shadow: 0 0 0 var(--cs-static);
}

.rg-textjay-fallback {
  margin-top: 18px;
  font-family: var(--font-mono); font-size: 12px;
  letter-spacing: 0.04em;
  color: var(--cs-static-60);
}
.rg-textjay-fallback b {
  color: var(--cs-static); font-weight: 700;
  letter-spacing: 0.06em;
}

/* ════════════════════════════════════════════════
   TOOLKIT — pinboard with prep tickets
   ════════════════════════════════════════════════ */
.rg-toolkit {
  padding: 90px 24px 70px;
  background:
    radial-gradient(circle at 12% 20%, rgba(80,140,200,0.04), transparent 38%),
    #f5eedc;
  border-top: 1.5px dashed rgba(30,30,30,0.15);
  border-bottom: 1.5px dashed rgba(30,30,30,0.15);
}
.rg-section-head {
  text-align: center; margin: 0 auto 50px;
  max-width: 720px;
}
.rg-section-eyebrow {
  font-family: var(--font-mono); font-size: 11.5px;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--cs-ballpoint); font-weight: 700;
  margin-bottom: 12px;
}
.rg-section-h2 {
  font-family: var(--font-display);
  font-size: clamp(30px, 4vw, 48px);
  font-weight: 600; line-height: 1.06;
  letter-spacing: -0.025em;
  color: var(--cs-static);
  margin: 0 0 14px;
}
.rg-section-h2 em {
  font-family: var(--font-serif); font-style: italic;
  color: var(--cs-ballpoint);
}
.rg-section-h2 span.hl {
  background: var(--cs-cellotape); padding: 0 8px;
}
.rg-section-sub {
  font-family: var(--font-serif); font-size: 17px;
  color: var(--cs-static-80); line-height: 1.55;
  margin: 0;
}

.rg-toolkit-grid {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 28px;
}
.rg-tk-card {
  position: relative;
  background: var(--cs-notebook);
  border: 2px solid var(--cs-static);
  box-shadow: 6px 6px 0 var(--cs-shadow-blue);
  padding: 0;
  display: flex; flex-direction: column;
  transition: transform .25s ease, box-shadow .25s ease;
}
.rg-tk-card:nth-child(1) { transform: rotate(-0.8deg); }
.rg-tk-card:nth-child(2) { transform: rotate(0.5deg); }
.rg-tk-card:nth-child(3) { transform: rotate(-0.4deg); }
.rg-tk-card:hover {
  transform: rotate(0) translateY(-4px);
  box-shadow: 10px 10px 0 var(--cs-shadow-blue);
}
.rg-tk-card::before {
  content: ""; position: absolute; top: -12px; left: 50%;
  transform: translateX(-50%) rotate(-3deg);
  width: 88px; height: 22px;
  background: var(--cs-cellotape);
  border: 1px dashed rgba(30,30,30,0.22);
  z-index: 2;
}
.rg-tk-thumb {
  aspect-ratio: 4/3;
  background: linear-gradient(135deg, #f5eedc 0%, #e9dfc2 100%);
  border-bottom: 1.5px dashed rgba(30,30,30,0.18);
  display: flex; align-items: center; justify-content: center;
  position: relative; overflow: hidden;
  padding: 16px;
}
.rg-tk-thumb svg { width: 100%; height: 100%; }
.rg-tk-body { padding: 22px 22px 22px; }
.rg-tk-tag {
  font-family: var(--font-mono); font-size: 9.5px;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--cs-ballpoint); font-weight: 700;
  margin-bottom: 8px;
}
.rg-tk-name {
  font-family: var(--font-display);
  font-size: 18px; font-weight: 700;
  letter-spacing: -0.01em; line-height: 1.2;
  color: var(--cs-static); margin-bottom: 6px;
}
.rg-tk-desc {
  font-family: var(--font-serif); font-size: 14.5px;
  line-height: 1.5; color: var(--cs-static-80);
  margin-bottom: 16px;
}
.rg-tk-btns {
  display: flex; gap: 8px; flex-wrap: wrap;
}
.rg-tk-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 14px;
  background: var(--cs-static); color: var(--cs-notebook);
  font-family: var(--font-mono); font-size: 11px;
  font-weight: 700; letter-spacing: 0.12em;
  text-transform: uppercase; text-decoration: none;
  border: 0;
  transition: background .15s;
  cursor: pointer;
}
.rg-tk-btn:hover { background: var(--cs-ballpoint); }
.rg-tk-btn svg { width: 11px; height: 11px; flex-shrink: 0; }

/* ════════════════════════════════════════════════
   CALENDAR — block your time card
   ════════════════════════════════════════════════ */
.rg-calendar {
  padding: 60px 24px 60px;
  background: #f5eedc;
}
.rg-cal-card {
  max-width: 720px; margin: 0 auto;
  background: var(--cs-notebook);
  border: 2px solid var(--cs-static);
  box-shadow: 8px 8px 0 var(--cs-shadow-blue);
  padding: 28px 32px;
  position: relative;
}
.rg-cal-step {
  position: absolute; top: -14px; left: -14px;
  width: 50px; height: 50px;
  background: var(--cs-ballpoint); color: var(--cs-notebook);
  border: 2px solid var(--cs-static);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-display); font-weight: 700; font-size: 22px;
  transform: rotate(-6deg);
}
.rg-cal-title {
  font-family: var(--font-display); font-size: 22px;
  font-weight: 700; letter-spacing: -0.015em;
  color: var(--cs-static); margin: 0 0 6px;
}
.rg-cal-sub {
  font-family: var(--font-serif); font-size: 15px;
  color: var(--cs-static-80); line-height: 1.5;
  margin: 0 0 18px;
}
.rg-cal-btns {
  display: flex; flex-wrap: wrap; gap: 10px;
}
.rg-cal-btn {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 12px 18px;
  background: var(--cs-notebook);
  border: 2px solid var(--cs-static);
  font-family: var(--font-mono); font-size: 11.5px;
  font-weight: 700; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--cs-static);
  cursor: pointer;
  transition: background .12s, transform .12s;
  text-decoration: none;
}
.rg-cal-btn:visited { color: var(--cs-static); }
.rg-cal-btn:hover { background: var(--cs-cellotape); transform: translateY(-2px); }
.rg-cal-btn svg { flex-shrink: 0; }

/* ════════════════════════════════════════════════
   CIRCLE / private group
   ════════════════════════════════════════════════ */
.rg-circle {
  padding: 70px 24px 80px;
  background: #f5eedc;
  border-top: 1.5px dashed rgba(30,30,30,0.15);
}
.rg-circle-card {
  max-width: 920px; margin: 0 auto;
  background: var(--cs-notebook);
  border: 2px solid var(--cs-static);
  box-shadow: 10px 10px 0 var(--cs-shadow-blue);
  padding: 32px 36px;
  display: grid;
  grid-template-columns: 1.2fr 1fr;
  gap: 32px;
  align-items: center;
  position: relative;
}
.rg-circle-card .rg-cal-step { background: var(--cs-ballpoint); }
.rg-circle-body h3 {
  font-family: var(--font-display); font-size: 24px;
  font-weight: 700; letter-spacing: -0.015em;
  color: var(--cs-static); margin: 0 0 12px;
}
.rg-circle-body p {
  font-family: var(--font-serif); font-size: 15.5px;
  color: var(--cs-static-80); line-height: 1.6;
  margin: 0 0 14px;
}
.rg-circle-cta {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 14px 22px;
  background: var(--cs-ballpoint); color: var(--cs-notebook);
  font-family: var(--font-mono); font-size: 12px;
  font-weight: 700; letter-spacing: 0.16em;
  text-transform: uppercase; text-decoration: none;
  border: 2px solid var(--cs-static);
  box-shadow: 5px 5px 0 var(--cs-static);
  transition: transform .12s, box-shadow .12s;
  margin-top: 6px;
}
.rg-circle-cta:hover {
  transform: translate(-2px,-2px);
  box-shadow: 7px 7px 0 var(--cs-static);
}

/* Circle phone mock */
.rg-circle-mock {
  background: var(--cs-static);
  padding: 12px 12px 8px;
  border-radius: 24px;
  border: 2px solid var(--cs-static);
  width: 280px; justify-self: center;
  position: relative;
  transform: rotate(2deg);
  box-shadow: 0 10px 30px rgba(0,0,0,0.18);
}
.rg-circle-mock::before {
  content: ""; position: absolute; top: 6px; left: 50%;
  transform: translateX(-50%);
  width: 80px; height: 6px; background: var(--cs-notebook);
  opacity: 0.18; border-radius: 3px;
}
.rg-circle-mock-screen {
  background: var(--cs-notebook);
  border-radius: 16px;
  padding: 18px 12px 12px;
  margin-top: 16px;
}
.rg-circle-mock-head {
  display: flex; align-items: center; gap: 8px;
  padding-bottom: 10px;
  border-bottom: 1px solid rgba(30,30,30,0.1);
  margin-bottom: 10px;
}
.rg-circle-mock-avatar {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--cs-ballpoint); color: var(--cs-notebook);
  font-family: var(--font-display); font-size: 11px; font-weight: 800;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.rg-circle-mock-info { flex: 1; }
.rg-circle-mock-name {
  font-family: var(--font-display); font-size: 12px; font-weight: 700;
  color: var(--cs-static);
}
.rg-circle-mock-meta {
  font-family: var(--font-mono); font-size: 8.5px;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--cs-static-60);
}
.rg-circle-mock-pinned {
  background: var(--cs-cellotape);
  padding: 5px 8px;
  font-family: var(--font-mono); font-size: 8.5px;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--cs-static); font-weight: 700;
  display: flex; align-items: center; gap: 6px;
  margin-bottom: 10px;
}
.rg-circle-mock-msg {
  margin-bottom: 8px;
}
.rg-circle-mock-msg .sender {
  font-family: var(--font-display); font-size: 10px; font-weight: 700;
  color: var(--cs-ballpoint);
  margin-bottom: 2px;
}
.rg-circle-mock-msg .bubble {
  background: #fdf4d9;
  padding: 6px 10px;
  font-family: var(--font-serif); font-size: 11px;
  line-height: 1.4; color: var(--cs-static);
}
.rg-circle-mock-msg.them .sender { color: var(--cs-ballpoint); }
.rg-circle-mock-msg.them .bubble { background: var(--cs-notebook); border: 1px solid rgba(30,30,30,0.08); }

/* ════════════════════════════════════════════════
   TIMELINE — what happens next (dark notebook)
   ════════════════════════════════════════════════ */
.rg-timeline {
  padding: 90px 24px 90px;
  background: var(--cs-static);
  color: var(--cs-notebook);
  position: relative; overflow: hidden;
}
.rg-timeline::before {
  content: ""; position: absolute; inset: 0;
  background-image:
    repeating-linear-gradient(0deg, transparent 0 38px, rgba(255,252,247,0.04) 38px 39px);
  pointer-events: none;
}
.rg-timeline .rg-section-eyebrow { color: var(--cs-cellotape); }
.rg-timeline .rg-section-h2 { color: var(--cs-notebook); }
.rg-timeline .rg-section-h2 em { color: var(--cs-cellotape); }
.rg-timeline .rg-section-sub { color: rgba(255,252,247,0.7); }

.rg-tl-list {
  max-width: 720px; margin: 0 auto;
  position: relative;
  padding-left: 56px;
}
.rg-tl-list::before {
  content: ""; position: absolute;
  left: 19px; top: 12px; bottom: 12px;
  width: 2.5px;
  background: linear-gradient(to bottom,
    var(--cs-ballpoint),
    var(--cs-cellotape),
    var(--cs-ballpoint));
}
.rg-tl-item {
  position: relative;
  margin-bottom: 28px;
}
.rg-tl-item:last-child { margin-bottom: 0; }
.rg-tl-marker {
  position: absolute; left: -56px; top: 6px;
  width: 40px; height: 40px;
  background: var(--cs-ballpoint); color: var(--cs-notebook);
  border: 2px solid var(--cs-notebook);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-display); font-weight: 700; font-size: 16px;
  box-shadow: 0 0 0 3px var(--cs-static);
}
.rg-tl-item:nth-child(2) .rg-tl-marker { background: var(--cs-cellotape); color: var(--cs-static); }
.rg-tl-item:nth-child(3) .rg-tl-marker { background: var(--cs-ballpoint); }
.rg-tl-item:nth-child(4) .rg-tl-marker { background: var(--cs-notebook); color: var(--cs-static); }

.rg-tl-card {
  background: rgba(255,252,247,0.05);
  border: 1.5px solid rgba(255,252,247,0.12);
  padding: 20px 24px;
  position: relative;
}
.rg-tl-tag {
  font-family: var(--font-mono); font-size: 10px;
  letter-spacing: 0.18em; text-transform: uppercase;
  font-weight: 700;
  margin-bottom: 8px;
  color: var(--cs-ballpoint);
}
.rg-tl-item:nth-child(2) .rg-tl-tag { color: var(--cs-cellotape); }
.rg-tl-item:nth-child(3) .rg-tl-tag { color: #6fa8e8; }
.rg-tl-item:nth-child(4) .rg-tl-tag { color: rgba(255,252,247,0.6); }
.rg-tl-card h4 {
  font-family: var(--font-display); font-size: 19px;
  font-weight: 700; letter-spacing: -0.01em;
  margin: 0 0 6px; color: var(--cs-notebook);
}
.rg-tl-card p {
  font-family: var(--font-serif); font-size: 14.5px;
  line-height: 1.55; color: rgba(255,252,247,0.72);
  margin: 0;
}
.rg-tl-card p b { color: var(--cs-notebook); font-family: var(--font-display); font-weight: 700; }

/* ════════════════════════════════════════════════
   UNLOCKED — gift cards grid (notebook)
   ════════════════════════════════════════════════ */
.rg-unlocked {
  padding: 90px 24px 80px;
  background: var(--cs-notebook);
  border-top: 1.5px dashed rgba(30,30,30,0.18);
}
.rg-unlocked-icon {
  display: inline-flex; margin-bottom: 16px;
  width: 64px; height: 64px;
  background: var(--cs-cellotape);
  border: 2px solid var(--cs-static);
  align-items: center; justify-content: center;
  transform: rotate(-3deg);
  box-shadow: 4px 4px 0 var(--cs-shadow-blue);
}
.rg-gift-grid {
  max-width: 920px; margin: 0 auto;
  display: grid; grid-template-columns: repeat(2, 1fr);
  gap: 18px;
}
.rg-gift-card {
  background: var(--cs-notebook);
  border: 2px solid var(--cs-static);
  padding: 22px 24px;
  position: relative;
  box-shadow: 4px 4px 0 var(--cs-static-20, rgba(30,30,30,0.18));
  transition: transform .15s, box-shadow .15s;
}
.rg-gift-card:hover {
  transform: translate(-2px,-2px);
  box-shadow: 6px 6px 0 var(--cs-shadow-blue);
}
.rg-gift-card::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0;
  width: 6px;
  background: var(--cs-ballpoint);
}
.rg-gift-card.b::before { background: var(--cs-ballpoint); }
.rg-gift-card.y::before { background: var(--cs-cellotape); }
.rg-gift-ic {
  width: 36px; height: 36px;
  background: rgba(80,140,200,0.1);
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 12px;
  border: 1.5px solid var(--cs-ballpoint);
}
.rg-gift-card.b .rg-gift-ic { background: rgba(80,140,200,0.1); border-color: var(--cs-ballpoint); }
.rg-gift-card.y .rg-gift-ic { background: var(--cs-cellotape); border-color: var(--cs-static); }
.rg-gift-ic svg { stroke: var(--cs-ballpoint); }
.rg-gift-card.b .rg-gift-ic svg { stroke: var(--cs-ballpoint); }
.rg-gift-card.y .rg-gift-ic svg { stroke: var(--cs-static); }
.rg-gift-name {
  font-family: var(--font-display);
  font-size: 16px; font-weight: 700;
  letter-spacing: -0.01em; line-height: 1.25;
  color: var(--cs-static); margin-bottom: 4px;
}
.rg-gift-desc {
  font-family: var(--font-serif); font-size: 13.5px;
  line-height: 1.5; color: var(--cs-static-80);
}

/* bookmark callout */
.rg-bookmark {
  max-width: 920px; margin: 36px auto 0;
  padding: 18px 24px;
  background: rgba(80,140,200,0.05);
  border: 1.5px dashed var(--cs-ballpoint);
  display: flex; align-items: center; gap: 14px;
  font-family: var(--font-serif); font-size: 15px;
  color: var(--cs-static); line-height: 1.5;
}
.rg-bookmark svg { flex-shrink: 0; }
.rg-bookmark .key {
  display: inline-block;
  background: var(--cs-static); color: var(--cs-notebook);
  font-family: var(--font-mono); font-size: 11px;
  font-weight: 700; padding: 2px 8px;
  margin: 0 2px;
}

/* ════════════════════════════════════════════════
   NOTE FROM JAY
   ════════════════════════════════════════════════ */
.rg-note {
  padding: 90px 24px 90px;
  background: #f5eedc;
  border-top: 1.5px dashed rgba(30,30,30,0.18);
  border-bottom: 1.5px dashed rgba(30,30,30,0.18);
}
.rg-note-inner {
  max-width: 760px; margin: 0 auto;
  display: grid;
  grid-template-columns: 200px 1fr;
  gap: 40px;
  align-items: flex-start;
}
.rg-note-photo {
  position: relative;
  background: var(--cs-notebook);
  border: 2px solid var(--cs-static);
  box-shadow: 8px 8px 0 var(--cs-shadow-blue);
  padding: 12px 12px 36px;
  transform: rotate(-3deg);
}
.rg-note-photo::before {
  content: ""; position: absolute; top: -12px; left: 50%;
  transform: translateX(-50%) rotate(-2deg);
  width: 90px; height: 20px;
  background: var(--cs-cellotape);
  border: 1px dashed rgba(30,30,30,0.22);
}
.rg-note-photo img {
  width: 100%; aspect-ratio: 4/5; object-fit: cover;
  display: block; background: #d4ccbe;
}
.rg-note-photo-cap {
  position: absolute; bottom: 8px; left: 0; right: 0;
  text-align: center;
  font-family: var(--font-hand); font-size: 18px;
  color: var(--cs-static);
}
.rg-note-body {
  position: relative;
  padding: 28px 28px;
  background: var(--cs-notebook);
  border: 2px solid var(--cs-static);
  box-shadow: 6px 6px 0 var(--cs-shadow-blue);
}
.rg-note-body::before {
  content: ""; position: absolute; top: -10px; right: 20px;
  width: 70px; height: 18px;
  background: var(--cs-cellotape);
  border: 1px dashed rgba(30,30,30,0.22);

/* ================================================================
   POPUP OPT-IN, global; triggered by any .openPopup / window.openOptInPopup()
   ================================================================ */
function Popup() {
  const [open, setOpen] = useState(false);
  const [first, setFirst] = useState('');
  const [email, setEmail] = useState('');
  const [done, setDone] = useState(false);
  const [context, setContext] = useState(null); // optional { title, sub }

  useEffect(() => {
    function openFn(ctx) { setContext(ctx || null); setDone(false); setOpen(true); }
    window.openOptInPopup = openFn;
    function onDocClick(e) {
      const t = e.target.closest('.openPopup');
      if (t) {
        e.preventDefault();
        const ctx = {
          title: t.getAttribute('data-popup-title') || undefined,
          sub: t.getAttribute('data-popup-sub') || undefined,
        };
        openFn(ctx);
      }
    }
    document.addEventListener('click', onDocClick);
    function onKey(e) { if (e.key === 'Escape') setOpen(false); }
    window.addEventListener('keydown', onKey);
    return () => {
      document.removeEventListener('click', onDocClick);
      window.removeEventListener('keydown', onKey);
    };
  }, []);

  useEffect(() => {
    document.body.style.overflow = open ? 'hidden' : '';
  }, [open]);

  function submit(e) {
    e.preventDefault();
    if (!first || !email) return;
    setDone(true);
  }

  if (!open) return null;
  return (
    <div className="popup-overlay" onClick={() => setOpen(false)}>
      <div className="popup-card" onClick={e => e.stopPropagation()}>
        <button className="popup-close" onClick={() => setOpen(false)} aria-label="Close">×</button>

        {/* Tape */}
        <span aria-hidden className="popup-tape popup-tape-l" />
        <span aria-hidden className="popup-tape popup-tape-r" />

        {done ? (
          <div className="popup-done">
            <div className="popup-done-stamp">YOU'RE IN</div>
            <h3 className="popup-done-title">Alright, {first}. See you June 23.</h3>
            <p className="popup-done-sub">
              Check your inbox, the confirmation is already there. One more thing before you go:
              I built a small upgrade for this event. Take a look, it's worth the two minutes.
              Skip it and you're still 100% in for all three days.
            </p>
            <a className="popup-cta" href="https://www.membershipsummit.com/vip" style={{ textDecoration: 'none', display: 'inline-block' }}>See the upgrade →</a>
          </div>
        ) : (
          <div className="popup-body">
            <div className="popup-kicker">FREE · LIVE, ONLINE · JUNE 23 to 25 · 1PM ET</div>
            <h3 className="popup-title">
              {context?.title || (<>Hold your seat for the three days.</>)}
            </h3>
            <p className="popup-sub">
              {context?.sub || "First name + email. I'll send the join links and a short note from me. That's it."}
            </p>
            <form onSubmit={submit} className="popup-form">
              <input type="text" placeholder="First name" value={first} onChange={e => setFirst(e.target.value)} required autoFocus />
              <input type="email" placeholder="you@yourdomain.com" value={email} onChange={e => setEmail(e.target.value)} required />
              <button type="submit" className="popup-cta" data-cta-label>Hold my seat →</button>
            </form>
            <div className="popup-fine">
              <span>✓ Free</span><span>✓ 3 days live with Jay</span><span>✓ Show up live</span>
            </div>
            <div className="popup-sig">
              <img src="assets/photos/jay-clouse-avatar.jpg" alt="" />
              <span>See you there,<br/><strong>Jay Clouse</strong> · Creator Science · The Lab</span>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

/* ---- Shared animation hook: draw-in on intersection ---- */
function useInView(threshold = 0.1) {
  const [seen, setSeen] = useState(false);
  const ref = useRef(null);
  useEffect(() => {
    if (seen) return;
    const node = ref.current;
    if (!node) return;
    const r = node.getBoundingClientRect();
    const vh = window.innerHeight || document.documentElement.clientHeight;
    if (r.top < vh && r.bottom > 0) { setSeen(true); return; }
    if (typeof IntersectionObserver === 'undefined') { setSeen(true); return; }
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) { setSeen(true); io.disconnect(); }
      });
    }, { threshold, rootMargin: '0px 0px -3% 0px' });
    io.observe(node);
    return () => io.disconnect();
  }, [seen]);
  return [ref, seen];
}

/* Parallax wrapper, subtle mouse-follow shift (for hero doodles) */
function MouseParallax({ children, strength = 10, rotate = 0, style = {}, className = '' }) {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    function onMove(e) {
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const x = (e.clientX / vw - 0.5) * strength;
      const y = (e.clientY / vh - 0.5) * strength;
      el.style.setProperty('--px', x + 'px');
      el.style.setProperty('--py', y + 'px');
    }
    window.addEventListener('mousemove', onMove, { passive: true });
    return () => window.removeEventListener('mousemove', onMove);
  }, [strength]);
  return (
    <span ref={ref} className={`mouse-parallax ${className}`} style={{
      display: 'inline-block',
      transform: `translate3d(var(--px,0), var(--py,0), 0) rotate(${rotate}deg)`,
      transition: 'transform 400ms cubic-bezier(.22,.61,.36,1)',
      willChange: 'transform',
      ...style,
    }}>{children}</span>
  );
}

/* Squiggle, draws in left to right */
function Squiggle({ width = 120, color = 'var(--cs-static-60)', amplitude = 5, delay = 0 }) {
  const [setRef, seen] = useInView();
  const d = [];
  const steps = 8;
  const w = width;
  d.push(`M0 ${amplitude}`);
  for (let i = 1; i <= steps; i++) {
    const x = (w / steps) * i;
    const y = i % 2 ? amplitude * 2 : 0;
    d.push(`Q ${x - w/steps/2} ${y} ${x} ${amplitude}`);
  }
  return (
    <svg ref={setRef} width={width} height={amplitude * 2 + 4} viewBox={`0 0 ${width} ${amplitude*2+4}`} aria-hidden>
      <path d={d.join(' ')} fill="none" stroke={color} strokeWidth="1.8" strokeLinecap="round"
            className={`draw-path ${seen ? 'is-in' : ''}`}
            style={{ transitionDelay: `${delay}ms` }}/>
    </svg>
  );
}

function TapeStrip({ width = 120, height = 28, rotate = -3, color = 'var(--cs-cellotape)', opacity = 0.7 }) {

function Countdown({ target = new Date('2026-05-26T17:00:00Z'), dark = false }) {
  const [t, setT] = useState(() => diff(target));
  useEffect(() => {
    const i = setInterval(() => setT(diff(target)), 1000);
    return () => clearInterval(i);
  }, [target]);
  function diff(d) {
    const ms = Math.max(0, d.getTime() - Date.now());
    return {
      days: Math.floor(ms / 86400000),
      hours: Math.floor((ms % 86400000) / 3600000),
      mins: Math.floor((ms % 3600000) / 60000),
      secs: Math.floor((ms % 60000) / 1000),
    };
  }
  const cell = {
    textAlign: 'center', minWidth: 58, padding: '8px 6px',

    background: dark ? 'transparent' : 'var(--cs-notebook)',

  };
  return (

      {[['Days', t.days],['Hrs', t.hours],['Min', t.mins],['Sec', t.secs]].map(([l,v]) => (

/* ================================================================
   Reveal on scroll
   ================================================================ */
function Reveal({ children, delay = 0, as: As = 'div', ...rest }) {
  const [seen, setSeen] = useState(false);
  const nodeRef = useRef(null);

  const setRef = (node) => {
    nodeRef.current = node;
    if (!node || seen) return;
    // If already on screen at mount, mark seen immediately (no flicker above the fold)
    const r = node.getBoundingClientRect();
    const vh = window.innerHeight || document.documentElement.clientHeight;
    if (r.top < vh && r.bottom > 0) {
      setSeen(true);
      return;
    }
    if (typeof IntersectionObserver === 'undefined') { setSeen(true); return; }
    const obs = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) { setSeen(true); obs.disconnect(); }
      });
    }, { threshold: 0.08, rootMargin: '0px 0px -5% 0px' });
    obs.observe(node);
  };

  // Safety net: if nothing has fired after 800ms, reveal anyway (never leave users with a blank page)
  useEffect(() => {
    if (seen) return;
    const t = setTimeout(() => setSeen(true), 800);
    return () => clearTimeout(t);
  }, [seen]);

  return (
    <As ref={setRef} className={`reveal ${seen ? 'is-in' : ''}`} style={{ transitionDelay: `${delay}ms` }} {...rest}>
      {children}
    </As>
  );
}

  const [open,   setOpen]   = React.useState(false);
  const [confirm, setConfirm] = React.useState(false);
  const [secs,   setSecs]   = React.useState(299);

  /* Bind to every .decline link on the page */
  React.useEffect(() => {
    function onClick(e) {
      const a = e.target.closest('.decline');
      if (!a) return;
      e.preventDefault();
      e.stopPropagation();
      setOpen(true);
    }
    document.addEventListener('click', onClick);
    return () => document.removeEventListener('click', onClick);
  }, []);

  /* 5-minute countdown that ticks only while the overlay is open. */
  React.useEffect(() => {
    if (!open) return;
    if (secs <= 0) return;
    const id = setInterval(() => setSecs(s => Math.max(0, s - 1)), 1000);
    return () => clearInterval(id);
  }, [open]);

  /* Lock body scroll while open. */
  React.useEffect(() => {
    document.body.style.overflow = (open || confirm) ? 'hidden' : '';
    return () => { document.body.style.overflow = ''; };

  const frameRef = React.useRef(null);

    if (!v) return;
    function onPlay() { setPlaying(true); }
    function onPause() { setPlaying(false); }
    function onTimeUpdate() { if (!videoReady) setVideoReady(true); }
    function onLoadedData() { setVideoReady(true); }
    v.addEventListener('play', onPlay);
    v.addEventListener('pause', onPause);
    v.addEventListener('timeupdate', onTimeUpdate);
    v.addEventListener('loadeddata', onLoadedData);
    return () => {
      v.removeEventListener('play', onPlay);
      v.removeEventListener('pause', onPause);
      v.removeEventListener('timeupdate', onTimeUpdate);
      v.removeEventListener('loadeddata', onLoadedData);
    };
  }, [mounted, videoReady]);

  React.useEffect(() => {
    if (mounted) return;
    const el = frameRef.current;
    if (!el) return;
    if (typeof IntersectionObserver === 'undefined') { setMounted(true); return; }

      for (const e of entries) {
        if (e.isIntersecting) { setMounted(true); io.disconnect(); return; }
      }

    io.observe(el);
    return () => io.disconnect();
  }, [mounted]);

/* Free summit = 3 days (Jun 23-25), 1:00-2:30 PM ET each. Same times as VIP.
   1:00 PM EDT = 17:00 UTC, 2:30 PM EDT = 18:30 UTC.
   WJ join/register link rides in the description. */
const RG_WJ_LINK = 'https://event.webinarjam.com/ykz838/register/3g0757tn';
const RG_CAL_TITLE = 'The Membership Summit with Jay Clouse';
const RG_CAL_DETAILS =
  '3 Days With Jay Clouse. Watch your inbox for your personalized join link ' +
  'the morning of each session. If you need to re-register: ' + RG_WJ_LINK;
const RG_GOOGLE_URL =
  'https://calendar.google.com/calendar/render?action=TEMPLATE' +
  '&text=' + encodeURIComponent(RG_CAL_TITLE) +
  '&dates=20260623T170000Z/20260623T183000Z' +
  '&recur=' + encodeURIComponent('RRULE:FREQ=DAILY;COUNT=3') +
  '&ctz=America/New_York' +
  '&location=' + encodeURIComponent(RG_WJ_LINK) +
  '&details=' + encodeURIComponent(RG_CAL_DETAILS);
function rgBuildIcs() {
  const days = [
    { n: 1, date: '20260623', label: 'Day 1: The Membership Summit with Jay Clouse' },
    { n: 2, date: '20260624', label: 'Day 2: The Membership Summit with Jay Clouse' },
    { n: 3, date: '20260625', label: 'Day 3: The Membership Summit with Jay Clouse' },
  ];
  const esc = (s) => s.replace(/\\/g, '\\\\').replace(/,/g, '\\,').replace(/;/g, '\\;').replace(/\n/g, '\\n');
  let ics = 'BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Jay Clouse//Membership Summit//EN\r\nCALSCALE:GREGORIAN\r\nMETHOD:PUBLISH\r\nX-WR-CALNAME:The Membership Summit with Jay Clouse\r\n';
  for (const d of days) {
    ics += 'BEGIN:VEVENT\r\n';
    ics += `UID:day${d.n}-membership-summit-2026@jayclouse.com\r\n`;
    ics += 'DTSTAMP:20260528T000000Z\r\n';
    ics += `DTSTART:${d.date}T170000Z\r\n`;
    ics += `DTEND:${d.date}T183000Z\r\n`;
    ics += `SUMMARY:${esc(d.label)}\r\n`;
    ics += `DESCRIPTION:${esc(RG_CAL_DETAILS)}\r\n`;
    ics += `URL:${RG_WJ_LINK}\r\n`;
    ics += 'LOCATION:Online (WebinarJam)\r\n';
    ics += 'STATUS:CONFIRMED\r\nSEQUENCE:0\r\n';
    ics += 'BEGIN:VALARM\r\nACTION:DISPLAY\r\n';
    ics += `DESCRIPTION:${esc(d.label)} starts in 30 minutes\r\n`;
    ics += 'TRIGGER:-PT30M\r\nEND:VALARM\r\nEND:VEVENT\r\n';
  }
  ics += 'END:VCALENDAR\r\n';
  return 'data:text/calendar;charset=utf-8,' + encodeURIComponent(ics);
}
const RG_ICS_URL = rgBuildIcs();
