<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>You&rsquo;re in &mdash; The Membership Summit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;700;800&family=Space+Mono:wght@400;700&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#faf4ea;
    --ink:#1b1b18;
    --muted:#716c61;
    --blue:#1b4dff;
    --orange:#fb531c;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    min-height:100vh; min-height:100dvh;
    background:var(--paper); color:var(--ink);
    font-family:"Hanken Grotesk", system-ui, sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding:32px; position:relative; overflow:hidden;
  }
  /* Soft warm vignette */
  body::before{
    content:""; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(120% 120% at 50% 42%, rgba(0,0,0,0) 58%, rgba(120,92,40,0.08) 100%);
  }
  /* Paper grain */
  .grain{
    position:fixed; inset:0; z-index:2; pointer-events:none;
    opacity:0.045; mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='150'%20height='150'%3E%3Cfilter%20id='n'%3E%3CfeTurbulence%20type='fractalNoise'%20baseFrequency='0.8'%20numOctaves='2'%20stitchTiles='stitch'/%3E%3C/filter%3E%3Crect%20width='100%25'%20height='100%25'%20filter='url(%23n)'/%3E%3C/svg%3E");
  }
  .stage{ position:relative; z-index:3; text-align:center; max-width:620px; }

  .kicker{
    font-family:"Space Mono", ui-monospace, monospace; font-weight:700;
    font-size:clamp(10.5px, 2.5vw, 12px); letter-spacing:0.18em; text-transform:uppercase;
    color:var(--ink); display:inline-flex; align-items:center; gap:9px; margin-bottom:30px;
  }
  .kicker .dot{ color:var(--orange); font-size:0.62em; transform:translateY(-1px); }

  .headline{
    font-family:"Hanken Grotesk", system-ui, sans-serif; font-weight:800;
    font-size:clamp(48px, 15vw, 108px); line-height:0.92; letter-spacing:-0.035em;
    color:var(--ink);
  }
  .headline .u{ position:relative; display:inline-block; }
  .headline .u svg{
    position:absolute; left:-6%; bottom:-0.12em; width:112%; height:0.3em; overflow:visible;
  }
  .headline .u path{
    fill:none; stroke:var(--orange); stroke-width:6; stroke-linecap:round;
  }

  .script{
    font-family:"Caveat", cursive; font-weight:700;
    font-size:clamp(30px, 8vw, 44px); color:var(--blue);
    margin-top:16px; line-height:1; transform:rotate(-2.5deg);
  }
  .script .sparkle{ font-size:0.8em; margin-left:3px; }

  .entering{
    font-family:"Space Mono", ui-monospace, monospace; font-weight:700;
    font-size:11px; letter-spacing:0.16em; text-transform:uppercase;
    color:var(--muted); margin-top:46px;
  }
  .track{
    margin:14px auto 0; width:min(260px, 72vw); height:4px;
    background:rgba(27,27,24,0.10); border-radius:99px; overflow:hidden;
  }
  .fill{
    display:block; height:100%; width:100%; border-radius:99px;
    background:linear-gradient(90deg, var(--blue), var(--orange));
  }

  .manual{
    display:inline-block; margin-top:32px; opacity:0; pointer-events:none;
    font-family:"Space Mono", ui-monospace, monospace; font-weight:700;
    font-size:13px; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--paper); background:var(--blue); text-decoration:none;
    padding:13px 22px; border-radius:7px; box-shadow:4px 4px 0 var(--ink);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .manual:hover{ transform:translate(-1px,-1px); box-shadow:5px 5px 0 var(--ink); }
  .manual:active{ transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink); }
  .manual.show{ opacity:1; pointer-events:auto; transition:opacity .55s ease; }

  @keyframes rise{ from{ opacity:0; transform:translateY(16px); } to{ opacity:1; transform:translateY(0); } }
  @keyframes scriptIn{ from{ opacity:0; transform:translateY(10px) rotate(-2.5deg); } to{ opacity:1; transform:translateY(0) rotate(-2.5deg); } }
  @keyframes drawLine{ to{ stroke-dashoffset:0; } }
  @keyframes fillUp{ from{ width:0; } to{ width:100%; } }

  @media (prefers-reduced-motion: no-preference){
    .kicker{ animation:rise .7s cubic-bezier(.2,.7,.2,1) both; animation-delay:.05s; }
    .headline{ animation:rise .9s cubic-bezier(.2,.7,.2,1) both; animation-delay:.2s; }
    .headline .u path{ stroke-dasharray:200; stroke-dashoffset:200; animation:drawLine .6s ease .95s forwards; }
    .script{ animation:scriptIn .7s cubic-bezier(.2,.7,.2,1) both; animation-delay:1.25s; }
    .entering{ animation:rise .6s ease both; animation-delay:1.5s; }
    .track{ animation:rise .6s ease both; animation-delay:1.55s; }
    .fill{ animation:fillUp 1700ms cubic-bezier(.5,.1,.3,1) forwards; animation-delay:800ms; }
  }
</style>
</head>
<body>
  <div class="grain"></div>
  <main class="stage">
    <p class="kicker"><span class="dot">&#9679;</span> The Membership Summit &middot; June 23&ndash;25</p>
    <h1 class="headline">You&rsquo;re <span class="u">in<svg viewBox="0 0 120 16" preserveAspectRatio="none"><path d="M3,11 C 26,6 46,13 66,9 C 86,5 103,12 117,7" /></svg></span>.</h1>
    <p class="script">see you inside<span class="sparkle">&#10035;</span></p>
    <p class="entering">Taking you into the room</p>
    <div class="track"><span class="fill"></span></div>
    <a class="manual" id="manual" href="#">Enter the room &rarr;</a>
  </main>

  <noscript>
    <div style="position:relative; z-index:3; text-align:center; margin-top:20px;">
      <a href="https://event.webinarjam.com/ykz838/go/live/3g0757tni3srs5" style="color:#1b4dff; font-family:monospace;">Enter the live room &rarr;</a>
    </div>
  </noscript>

  <script>
    (function () {
      // Generic direct link to Jay's webinar — last-resort fallback only
      var FALLBACK = "https://event.webinarjam.com/ykz838/go/live/3g0757tni3srs5";

      var params = new URLSearchParams(window.location.search);
      var roomUrl = params.get("wj_lead_unique_link_live_room");
      var target = (roomUrl && roomUrl.indexOf("http") === 0) ? roomUrl : FALLBACK;

      var manual = document.getElementById("manual");
      manual.href = target;

      // Reveal the fallback button only if the redirect hasn't carried them off
      setTimeout(function () { manual.classList.add("show"); }, 2700);

      // Hand them into the room
      setTimeout(function () { window.location.replace(target); }, 2400);
    })();
  </script>
</body>
</html>
